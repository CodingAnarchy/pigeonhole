name: Bench RocksDB build

# Builds and tests pigeonhole-bench with every comparison runner, including RocksDB
# (C++ and bindgen), so the `rocksdb` feature cannot rot. Kept out of the PR-gating CI
# workflow because it compiles RocksDB from source (docs/bench.md).

on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * 1" # Mondays 05:47 UTC, after the bench suite
  push:
    branches: [main]
    paths:
      - "crates/bench/**"

# A newer push to a pull request supersedes its older run (cancelled); a push to main never
# cancels the run before it, or with merges landing faster than a run main never finishes one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rocksdb:
    name: bench (all comparison runners, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libclang (bindgen for librocksdb-sys)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev clang
      - run: cargo clippy -p pigeonhole-bench --all-targets --all-features -- -D warnings
      - run: cargo test -p pigeonhole-bench --all-features
