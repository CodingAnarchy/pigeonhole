name: Changelog

# Checks the changelog.d/ fragments (scripts/changelog.py) and the tool's own tests. Python
# only, a few seconds, and on every PR: docs-only PRs skip CI (its paths-ignore) but can still
# add or break a fragment.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request supersedes its older run (cancelled); a push to main never
# cancels the run before it, or with merges landing faster than a run main never finishes one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fragments:
    name: changelog fragments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/changelog.py check
      - run: python3 scripts/test_changelog.py
