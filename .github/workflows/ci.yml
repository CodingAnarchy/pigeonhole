name: CI

# Kept to four jobs to limit runner usage. During GitHub Actions outages jobs can
# fail with "not acquired by Runner"; re-run them once the outage clears.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings
  PROPTEST_CASES: 256
  # pigeonhole-bench's `rocksdb` feature builds RocksDB from C++ source, so CI builds
  # the bench crate with its other comparison runners only (docs/bench.md).
  BENCH_FEATURES: sqlite,fjall

jobs:
  linux:
    name: linux (fmt, clippy, docs, test, deny, semver)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-semver-checks
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude pigeonhole-bench --all-targets --all-features -- -D warnings
      - run: cargo clippy -p pigeonhole-bench --all-targets --features "$BENCH_FEATURES" -- -D warnings
      - run: cargo doc --workspace --exclude pigeonhole-bench --no-deps --all-features
      - run: cargo doc -p pigeonhole-bench --no-deps --features "$BENCH_FEATURES"
      - run: cargo test --workspace --exclude pigeonhole-bench --all-features
      - run: cargo test -p pigeonhole-bench --features "$BENCH_FEATURES"
      - run: cargo deny check
      - name: semver checks (published crates only)
        shell: bash
        run: |
          set -euo pipefail
          for pkg in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish != []) | .name'); do
            if curl -fsS -A "pigeonhole-ci (github.com/CodingAnarchy/pigeonhole)" "https://crates.io/api/v1/crates/$pkg" >/dev/null 2>&1; then
              cargo semver-checks -p "$pkg"
            else
              echo "skip $pkg: not yet published"
            fi
          done

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude pigeonhole-bench --all-features
      - run: cargo test -p pigeonhole-bench --features "${{ env.BENCH_FEATURES }}"

  analysis:
    name: analysis (MSRV, Miri, loom)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: MSRV 1.96
        run: |
          cargo +1.96 check --workspace --exclude pigeonhole-bench --all-features
          cargo +1.96 check -p pigeonhole-bench --all-targets --features "$BENCH_FEATURES"
      - name: Miri (crates with unsafe)
        run: cargo +nightly miri test -p pigeonhole-io -p pigeonhole-memtable
        env:
          PROPTEST_CASES: 8
          MIRIFLAGS: -Zmiri-disable-isolation
      - name: loom
        run: cargo test --release -p pigeonhole-memtable -p pigeonhole-cache --lib loom
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: 3
          CARGO_TARGET_DIR: target/loom
