name: CI

# Kept to four jobs to limit runner usage. During GitHub Actions outages jobs can
# fail with "not acquired by Runner"; re-run them once the outage clears.

on:
  push:
    branches: [main]
    paths-ignore:
      # Skip CI when every changed file is documentation no build or test reads.
      # NOT listed (they are doctested via include_str!, so they must run CI):
      # README.md, crates/pigeonhole/README.md and docs/guide/*.md.
      - 'docs/design/**'
      - 'docs/status.md'
      - 'docs/bench.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'FORMAT.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:  # same list as push
      - 'docs/design/**'
      - 'docs/status.md'
      - 'docs/bench.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'FORMAT.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings
  PROPTEST_CASES: 256
  # pigeonhole-bench's `rocksdb` feature builds RocksDB from C++ source, so CI builds
  # the bench crate with its other comparison runner (SQLite) only. bench-rocksdb.yml builds
  # and tests the rocksdb feature weekly and on bench changes to main (docs/bench.md).
  BENCH_FEATURES: sqlite

jobs:
  linux:
    name: linux (fmt, clippy, docs, test, deny, semver)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-semver-checks,cargo-public-api@0.52.0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude pigeonhole-bench --all-targets --all-features -- -D warnings
      - run: cargo clippy -p pigeonhole-bench --all-targets --features "$BENCH_FEATURES" -- -D warnings
      - run: cargo doc --workspace --exclude pigeonhole-bench --no-deps --all-features
      - run: cargo doc -p pigeonhole-bench --no-deps --features "$BENCH_FEATURES"
      - run: cargo test --workspace --exclude pigeonhole-bench --all-features
      # The golden files frozen at 1.0 (#695): the golden test checks each against its line in
      # golden-frozen.txt, and this checks that a PR only appends lines there.
      - name: frozen golden files only gain siblings
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          python3 scripts/golden-frozen.py FETCH_HEAD
      # #692: `cargo install pigeonhole-cli` keeps working. Install `phdb` from this checkout
      # (release, with the lockfile) into a scratch root, then use the installed binary end to
      # end: make a database, write and read through the shell, and check it.
      - name: install phdb and run it
        run: |
          cargo install --path crates/cli --locked --root "$RUNNER_TEMP/phdb"
          phdb="$RUNNER_TEMP/phdb/bin/phdb"
          "$phdb" --version
          db="$RUNNER_TEMP/smoke.phdb"
          # A new, empty database: a dump with only its header (#1037; an empty input is
          # refused).
          echo '{"phdb":1,"command":"dump"}' | "$phdb" load --create "$db" -
          "$phdb" shell "$db" -c "create t f" -c "put t r f:q v" -c "get t r f:q" | grep -q 'v$'
          "$phdb" --format json info "$db" | grep -q '"name": "t"'
          "$phdb" check "$db"
      # #691: `phdb dump --format arrow` is an Arrow IPC stream another Arrow reader takes.
      # Polars (pinned) reads a dump whose family dictionary grows mid-stream and checks its
      # cells, typed columns and types.
      - name: an arrow dump read by Polars
        run: |
          phdb="$RUNNER_TEMP/phdb/bin/phdb"
          db="$RUNNER_TEMP/arrow.phdb"
          python3 scripts/arrow-smoke.py jsonl | "$phdb" load --create "$db" -
          "$phdb" dump --format arrow --table t "$db" > "$RUNNER_TEMP/t.arrows"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet polars==2.0.0
          "$RUNNER_TEMP/venv/bin/python" scripts/arrow-smoke.py check "$RUNNER_TEMP/t.arrows"
      - run: cargo test -p pigeonhole-bench --features "$BENCH_FEATURES"
      # The public crate on its own: feature unification gives the workspace run an engine
      # built with `test-hooks`, and this run tests the production one (#148, review 1-2 F10).
      - name: pigeonhole tests without the engine's test hooks
        run: cargo test -p pigeonhole --all-features
      # The io_uring backend (#402), the default on Linux since D218 (`IoBackend::Auto`), so
      # the runs above already used it. This runs the public crate's suites, the real-file
      # model check and the real-file engine, WAL and pager tests on it forced: `uring` fails
      # to open rather than fall back, so a runner without io_uring fails here instead of
      # passing on `pread`.
      - name: tests on io_uring
        run: |
          cargo test -p pigeonhole --all-features
          # The model check on real files (shard rings, real fsyncs; #402's suites criterion).
          PIGEONHOLE_REAL_FS=1 cargo test -p pigeonhole --all-features --test model
          # The engine, WAL and pager tests that run on real files.
          cargo test -p pigeonhole-engine --all-features --test api engine_owned_mode_on_real_files
          cargo test -p pigeonhole-wal --all-features --test pread
          cargo test -p pigeonhole-pager --all-features --test api
        env:
          PIGEONHOLE_IO: uring
      # The `pread` pool on Linux, now that the default picks io_uring here (D218): the same
      # real-file suites, so the fallback backend keeps its Linux coverage.
      - name: tests on pread
        run: |
          PIGEONHOLE_REAL_FS=1 cargo test -p pigeonhole --all-features --test model
          cargo test -p pigeonhole-engine --all-features --test api engine_owned_mode_on_real_files
          cargo test -p pigeonhole --all-features --test api
        env:
          PIGEONHOLE_IO: pread
      # Direct I/O for SST and blob extents (#403): the simulated model check with direct
      # handles (every SST read and write must be aligned there) and the real-file model
      # check with O_DIRECT, on io_uring.
      - name: tests with direct I/O
        run: |
          cargo test -p pigeonhole-engine --all-features --test model_check
          PIGEONHOLE_REAL_FS=1 PIGEONHOLE_IO=uring cargo test -p pigeonhole --all-features --test model
        env:
          PIGEONHOLE_DIRECT: "1"
      - run: cargo deny check
      # The semver crates' public API against their committed snapshots (#695): any added,
      # changed or removed item fails until `scripts/public-api.sh bless` records it, so new
      # API is reviewed (and has an ICR) before 1.x freezes it. The nightly is pinned with the
      # tool, since rustdoc's JSON changes between nightlies.
      - name: public API snapshots
        run: |
          rustup toolchain install nightly-2026-10-05 --profile minimal
          scripts/public-api.sh check
      - name: semver checks (published crates only)
        shell: bash
        run: |
          set -euo pipefail
          for pkg in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish != []) | .name'); do
            if curl -fsS -A "pigeonhole-ci (github.com/CodingAnarchy/pigeonhole)" "https://crates.io/api/v1/crates/$pkg" >/dev/null 2>&1; then
              cargo semver-checks -p "$pkg"
            else
              echo "skip $pkg: not yet published"
            fi
          done

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude pigeonhole-bench --all-features
      - run: cargo test -p pigeonhole-bench --features "${{ env.BENCH_FEATURES }}"

  analysis:
    name: analysis (MSRV, Miri, loom)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: MSRV 1.96
        run: |
          cargo +1.96 check --workspace --exclude pigeonhole-bench --all-features
          cargo +1.96 check -p pigeonhole-bench --all-targets --features "$BENCH_FEATURES"
      - name: Miri (crates with unsafe)
        run: cargo +nightly miri test -p pigeonhole-io -p pigeonhole-memtable
        env:
          PROPTEST_CASES: 8
          MIRIFLAGS: -Zmiri-disable-isolation
      - name: loom
        run: cargo test --release -p pigeonhole-memtable -p pigeonhole-cache -p pigeonhole-runtime --lib loom
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: 3
          CARGO_TARGET_DIR: target/loom
      # The engine's models (the close gate, #134) use a cfg of their own: `--cfg loom` would
      # switch its dependencies' loom-only code too.
      - name: loom (engine)
        run: cargo test --release -p pigeonhole-engine --lib loom
        env:
          RUSTFLAGS: --cfg engine_loom
          CARGO_TARGET_DIR: target/loom-engine
      # The io crate's model (the ring wake, #402) likewise has a cfg of its own.
      - name: loom (io)
        run: cargo test --release -p pigeonhole-io --lib loom
        env:
          RUSTFLAGS: --cfg io_loom
          CARGO_TARGET_DIR: target/loom-io
