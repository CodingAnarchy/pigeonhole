name: Compatibility

# FORMAT.md §13, "newer files": files written by main open with the published 1.0.0.
# main writes the corpus entries (tests/corpus.rs's generate_corpus, PIGEONHOLE_CORPUS_OUT),
# and tests/corpus/compat-reader, pinned to pigeonhole =1.0.0 from crates.io, opens each
# one on a copy: it reads every cell exactly, writes through a flush and a compaction,
# passes the offline check, and reads everything again. An entry using a feature 1.0.0 lacks
# may be refused with UnsupportedFeature, as the promise allows.
#
# Until pigeonhole 1.0.0 is on crates.io, the job only checks that and skips the rest, so it
# enables itself at the release. crates.io answering anything but 200 or 404 fails the job,
# so an outage never passes as a skip.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/compat.yml"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

# A newer push to a pull request supersedes its older run (cancelled); a push to main never
# cancels the run before it, or with merges landing faster than a run main never finishes one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  newer-files:
    name: main's files open with 1.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Is pigeonhole 1.0.0 on crates.io?
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "pigeonhole-ci (https://github.com/CodingAnarchy/pigeonhole)" \
            https://crates.io/api/v1/crates/pigeonhole/1.0.0)
          case $status in
            200) echo "yes=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "yes=false" >> "$GITHUB_OUTPUT"
              echo "::notice::pigeonhole 1.0.0 isn't on crates.io yet; skipping (FORMAT.md §13)"
              ;;
            *) echo "::error::crates.io answered $status"; exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        if: steps.published.outputs.yes == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.published.outputs.yes == 'true'
        with:
          workspaces: |
            . -> target
            crates/pigeonhole/tests/corpus/compat-reader -> target
      - name: Write main's corpus
        if: steps.published.outputs.yes == 'true'
        env:
          PIGEONHOLE_CORPUS_OUT: ${{ runner.temp }}/main-corpus
        run: cargo test -p pigeonhole --test corpus -- --ignored --exact generate_corpus --nocapture
      - name: Open it with 1.0.0
        if: steps.published.outputs.yes == 'true'
        run: >
          cargo run --release
          --manifest-path crates/pigeonhole/tests/corpus/compat-reader/Cargo.toml
          -- "$RUNNER_TEMP/main-corpus"
