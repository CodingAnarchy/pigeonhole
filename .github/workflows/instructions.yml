name: Instructions per cell

# Read-path instructions per unit, counted by callgrind (deterministic), for the PR's base and
# head: the hot row's three states (crates/bench/examples/hotrow.rs, per cell) and the read
# shapes of crates/bench/examples/readshapes.rs (point gets, narrow rows, scans, filtered
# scans, multi-version and counter reads), write shapes of writepath.rs and the YCSB-style
# operations of ycsb.rs. A main-vs-branch
# table goes in the job summary, and the job fails if any state or shape gets worse by more
# than its threshold in THRESHOLDS (#287: no regressions; the thresholds only absorb
# callgrind's run-to-run noise). Runs only when the read path changes.

on:
  pull_request:
    paths:
      - 'crates/compaction/**'
      - 'crates/engine/**'
      - 'crates/sst/**'
      - 'crates/format/**'
      - 'crates/memtable/**'
      - 'crates/cache/**'
      - 'crates/pigeonhole/**'
      - 'crates/bench/examples/hotrow.rs'
      - 'crates/bench/examples/readshapes.rs'
      - 'crates/bench/examples/writepath.rs'
      - 'crates/bench/examples/ycsb.rs'
      - 'crates/bench/examples/support/**'
      - 'scripts/instructions-per-cell.sh'
      - 'scripts/instruction-ceilings.py'
      - 'crates/bench/baselines/instruction-ceilings.txt'
      - '.github/workflows/instructions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Examples built at base and head (crates/bench/examples/NAME.rs). The base is built with
  # the head's sources of these files, so a new or changed example still has a baseline.
  EXAMPLES: hotrow readshapes writepath ycsb
  # The write shapes run with `Options::commit_spin(ZERO)` (crates/bench/examples/support/
  # shards.rs): how often a waiting client polls depends on thread timing (D198), so counting
  # it would make the shapes nondeterministic. The default spin is checked on wall time
  # instead, by crates/bench/examples/commitpath.rs (commit-latency.yml).
  # Shape binaries and their shapes, `EXAMPLE:shape,shape,...` (space-separated), in the
  # contract of scripts/instructions-per-cell.sh. Add a shape here and it is reported and
  # checked for regressions on every PR.
  SHAPES: >-
    readshapes:get-mem,get-sst,get-miss,row,scan,scan-filtered,versions,counter,rows,level-scans,short-scans
    writepath:commit-one,commit-sixteen,commit-overwrite,commit-at,flush,compact
    ycsb:ycsb-c,ycsb-a
  # The largest increase (percent of the base) a state or shape may show before the job fails,
  # `name=percent` (space-separated), with `default` for the rest. Set from callgrind's
  # run-to-run noise on identical code (#354): within 0.1% for the hot-row states and read
  # shapes. `row` keeps 1.5% for now. The writepath shapes take the default too since they run
  # their measured work on fresh threads (#360): two identical-code runs agreed within 0.2%
  # (runs 37900128944 and 37901737150). If a shape proves noisier on CI, report it rather
  # than raising its threshold silently.
  # The YCSB shapes get 1.0%: identical code varied by up to 0.54% across runs.
  THRESHOLDS: default=0.5 row=1.5 ycsb-c=1.0 ycsb-a=1.0 commit-overwrite=1.0

jobs:
  instructions:
    name: hotrow instructions per cell (callgrind)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install valgrind
        run: sudo apt-get update -q && sudo apt-get install -y -q valgrind
      - name: build the examples (head and base)
        shell: bash
        run: |
          set -euo pipefail
          # A PR checks out GitHub's merge of the head into the current main, which may be
          # newer than the event's base.sha: the merge's first parent is exactly the main it
          # was built on, so the table shows only the PR's own change.
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            base="$(git rev-parse HEAD^1)"
          else
            base=origin/main
          fi
          flags=() srcs=()
          for e in $EXAMPLES; do
            flags+=(--example "$e")
            srcs+=("crates/bench/examples/$e.rs")
          done
          mkdir -p /tmp/bin-head /tmp/bin-base
          # Default features of every crate, always: the counts must be what a user of the
          # published crates gets (#430: `pigeonhole`'s default-on `async` adds a second,
          # cache-only instance of the read paths). Never pass --no-default-features or
          # --features here, and keep the bench's dependencies on their default features.
          cargo build --release -p pigeonhole-bench "${flags[@]}"
          for e in $EXAMPLES; do cp "target/release/examples/$e" /tmp/bin-head/; done
          git worktree add -q /tmp/base "$base"
          cp "${srcs[@]}" /tmp/base/crates/bench/examples/
          # Shared example modules (the `Measured` guard), also at the head's version.
          cp -R crates/bench/examples/support /tmp/base/crates/bench/examples/
          (cd /tmp/base && cargo build --release -p pigeonhole-bench "${flags[@]}" \
            --target-dir "$GITHUB_WORKSPACE/target")
          for e in $EXAMPLES; do cp "target/release/examples/$e" /tmp/bin-base/; done
      - name: count
        shell: bash
        run: |
          set -euo pipefail
          for side in base head; do
            groups=()
            for g in $SHAPES; do groups+=("/tmp/bin-$side/$g"); done
            scripts/instructions-per-cell.sh "/tmp/bin-$side/hotrow" "${groups[@]}" > "/tmp/$side.txt"
          done
          {
            echo "### Instructions per unit (callgrind)"
            echo
            echo "Hot row (\`hotrow.rs\`, row read + 10-row scan): per cell. Shapes: per unit as each example documents (\`readshapes.rs\`: per point get, or per returned cell)."
            echo
            echo "| State or shape | base | head | change |"
            echo "|---|--:|--:|--:|"
            paste -d' ' /tmp/base.txt /tmp/head.txt | awk '{ print $1, $2, $4 }' | while read -r state b h; do
              echo "| $state | $b | $h | $(awk -v b="$b" -v h="$h" 'BEGIN { printf "%+.1f%%", 100 * (h - b) / b }') |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # The head must also stay at or below every shape's absolute ceiling (D193): the
          # Phase 2 floors may not regress, not even in steps below the per-PR thresholds.
          {
            echo
            echo "### Absolute ceilings (D193, crates/bench/baselines/instruction-ceilings.txt)"
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ceilings=0
          python3 scripts/instruction-ceilings.py check /tmp/head.txt | tee -a "$GITHUB_STEP_SUMMARY" || ceilings=1
          paste -d' ' /tmp/base.txt /tmp/head.txt | awk -v thresholds="$THRESHOLDS" '
            BEGIN {
              n = split(thresholds, kv, " ")
              for (i = 1; i <= n; i++) { split(kv[i], p, "="); limit[p[1]] = p[2] }
            }
            {
              t = ($1 in limit) ? limit[$1] : limit["default"]
              if ($4 > $2 * (1 + t / 100)) {
                printf "regression: %s %s -> %s (%+.2f%%, threshold %s%%)\n", $1, $2, $4, 100 * ($4 - $2) / $2, t
                bad = 1
              }
            }
            END { exit bad }'
          if [ "$ceilings" != 0 ]; then
            echo "a shape is above its absolute ceiling, or has none (D193)"
            exit 1
          fi
