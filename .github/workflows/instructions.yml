name: Instructions per cell

# Read-path instructions per unit, counted by callgrind (deterministic), for the PR's base and
# head: the hot row's three states (crates/bench/examples/hotrow.rs, per cell) and the read
# shapes of crates/bench/examples/readshapes.rs (point gets, narrow rows, scans, filtered
# scans, multi-version and counter reads), write shapes of writepath.rs and the YCSB-style
# operations of ycsb.rs. A main-vs-branch
# table goes in the job summary, and the job fails if any state or shape gets worse by more
# than its threshold in THRESHOLDS (#287: no regressions; the thresholds only absorb
# callgrind's run-to-run noise). Runs only when the read path changes.

on:
  pull_request:
    paths:
      - 'crates/compaction/**'
      - 'crates/engine/**'
      - 'crates/sst/**'
      - 'crates/format/**'
      - 'crates/memtable/**'
      - 'crates/cache/**'
      - 'crates/io/**'
      - 'crates/pager/**'
      - 'crates/runtime/**'
      - 'crates/shm/**'
      - 'crates/wal/**'
      - 'crates/pigeonhole/**'
      - 'crates/bench/examples/hotrow.rs'
      - 'crates/bench/examples/readshapes.rs'
      - 'crates/bench/examples/writepath.rs'
      - 'crates/bench/examples/ycsb.rs'
      - 'crates/bench/examples/textshapes.rs'
      - 'crates/text/**'
      - 'crates/bench/examples/support/**'
      - 'scripts/instructions-per-cell.sh'
      - 'scripts/instruction-ceilings.py'
      - 'crates/bench/baselines/instruction-ceilings.txt'
      - '.github/workflows/instructions.yml'
      - 'scripts/install-valgrind.sh'
  workflow_dispatch:
  # Daily on main, only the valgrind-debs job: it saves this image's valgrind .debs once per
  # image version, in main's cache scope, which every PR can read.
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The pread backend, as the ceilings were set on: io_uring is the default on Linux since
  # D218, and its work happens in the kernel, where callgrind does not count it (and valgrind
  # runs its ring waits slowly). Base and head both read this.
  PIGEONHOLE_IO: pread
  # The examples (EXAMPLES) and shapes (SHAPES) are per job: see the matrix below.
  # The largest increase (percent of the base) a state or shape may show before the job fails,
  # `name=percent` (space-separated), with `default` for the rest. Set from callgrind's
  # run-to-run noise on identical code (#354): within 0.1% for the hot-row states and read
  # shapes. `row` keeps 1.5% for now. The writepath shapes take the default too since they run
  # their measured work on fresh threads (#360): two identical-code runs agreed within 0.2%
  # (runs 37900128944 and 37901737150). If a shape proves noisier on CI, report it rather
  # than raising its threshold silently.
  # The YCSB shapes get 1.0%: identical code varied by up to 0.54% across runs.
  # `compact` gets 1.0%: identical code measured 2660-2678 (0.7%) across nine A/Bs (blob33).
  # `get-sst` gets 1.0% until #909 pins its noise: identical code on main read 17234 and 17280
  # (runs 39856495172, 39859158837), and #910's +0.6% was that noise (owner's D195 policy).
  # `compacted`, `get-miss`, `scan-wide-q10` and `scan-filtered` get 0.8% for #994 (D288 PR 1,
  # #711; owner's D195 policy via the coordinator, 2026-10-27): the merge tests its lazy flag once
  # per move, and a filtered memtable source checks the entry it lands on once (+0.57%, +0.51%,
  # +0.62%, +0.51%: 1, 1, 3 and 1 instructions per unit over 0.5%, runs 40483245930 and
  # 40504883826), while scan-interleaved, the shape D288 is for, fell 91%.
  # `counter` gets 0.8% for #1009 (D291, #713; owner's D195 policy via the coordinator,
  # 2026-10-28): a counter group counts the entries it folds and tests for its stop at a base
  # or column delete (+42 per get, +0.49%, scratch x86 A/B run of 06c4ef89 against d77b17d3),
  # while the counter read the D280 row measures fell from 2.3-5.5 ms to 35-40 µs at p99.
  THRESHOLDS: default=0.5 row=1.5 ycsb-c=1.0 ycsb-a=1.0 commit-overwrite=1.0 compact=1.0 get-sst=1.0 compacted=0.8 get-miss=0.8 scan-wide-q10=0.8 scan-filtered=0.8 counter=0.8

jobs:
  # Valgrind's .debs, cached so the callgrind jobs don't need the Ubuntu archive (down for
  # every hosted runner on 2026-11-11, #1736). Keyed on the runner image, whose package lists
  # and libc6 fix the versions apt picks (libc6-dbg must match libc6 exactly). On a miss for
  # this image it installs through apt and saves the .debs: once per image version on main
  # (the daily schedule), and in a PR's own scope only when main has no entry for the image
  # yet. A cache entry is never overwritten; `v1` is the salt to force a refresh, ahead of the
  # image so a bump also stops the older-image fallback from matching the old entries.
  valgrind-debs:
    name: valgrind .debs
    # The measuring jobs' image (below), so the .debs it saves are the ones they install.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/install-valgrind.sh
          sparse-checkout-cone-mode: false
      - id: key
        run: echo "key=callgrind-debs-v1-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - id: have
        uses: actions/cache/restore@v5
        with:
          path: /tmp/valgrind-debs
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      # Not fatal here: with the archive down, the measuring jobs may still install from an
      # older image's entry, and they fail on their own if they can't install at all.
      - name: install valgrind through apt, keeping the .debs
        id: apt
        if: steps.have.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 8
        run: scripts/install-valgrind.sh apt /tmp/valgrind-debs
      - if: steps.apt.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: /tmp/valgrind-debs
          key: ${{ steps.key.outputs.key }}

  instructions:
    name: ${{ matrix.name }}
    # After the .debs job, but also when it failed (the archive down with no entry yet): the
    # install step then tries apt itself, bounded, and fails the job if that fails too.
    needs: valgrind-debs
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    # A fixed image, never ubuntu-latest: callgrind counts depend on the image's glibc and
    # valgrind. Identical code on Rust 1.100 counts get-sst 16615 on ubuntu-24.04 (valgrind
    # 3.22) and 16737 on ubuntu-26.04 (valgrind 3.26), and commit-one 8621 against 8479, so a
    # run would pass or fail the ceilings by which image it got. Moving to another image is a
    # re-baseline of every ceiling in the same PR (#1795).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Two jobs in parallel (#1575): the read and write shapes, and the text-search shapes,
    # which alone took about 20 minutes a side under valgrind and pushed one job to its
    # 60-minute timeout. Each builds and counts only its own examples, and checks only its
    # own shapes against the ceilings.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hotrow instructions per cell (callgrind)
            # Examples built at base and head (crates/bench/examples/NAME.rs). The base is
            # built with the head's sources of these files, so a new or changed example still
            # has a baseline.
            examples: hotrow readshapes writepath ycsb scanrate
            # The hot row's three states run too (scripts/instructions-per-cell.sh's first
            # argument); `-` skips them.
            hotrow: hotrow
            # Shape binaries and their shapes, `EXAMPLE:shape,shape,...` (space-separated), in
            # the contract of scripts/instructions-per-cell.sh. Add a shape here and it is
            # reported and checked for regressions on every PR. The write shapes run with
            # `Options::commit_spin(ZERO)` (crates/bench/examples/support/shards.rs): how
            # often a waiting client polls depends on thread timing (D198), so counting it
            # would make the shapes nondeterministic. The default spin is checked on wall
            # time instead, by crates/bench/examples/commitpath.rs (commit-latency.yml).
            shapes: >-
              readshapes:get-mem,get-sst,get-miss,row,scan,scan-filtered,versions,counter,rows,level-scans,short-scans,scan-interleaved,wide-row-cells,wide-row-pages,scan-budget,scan-budget-twin,multi-get-dense,multi-get-sparse,knn-exact,knn-filtered,knn-exact-f16,knn-exact-bf16,knn-budget
              writepath:commit-one,commit-sixteen,commit-overwrite,commit-at,commit-async,commit-incr,commit-incr-returning,commit-incr-returning-spread,commit-put-previous,commit-if-returning,flush,compact
              ycsb:ycsb-c,ycsb-a
              scanrate:scan-narrow,scan-small,scan-wide,scan-narrow-q1,scan-wide-q10,scan-wide-q1
          - name: text search instructions per search (callgrind)
            # The sync text search's floor (#1560 PR 0, crates/bench/examples/textshapes.rs).
            examples: textshapes
            hotrow: '-'
            shapes: >-
              textshapes:text-term-rare,text-term-hub,text-two-terms,text-five-terms,text-two-terms-k100,text-fuzzy,text-phrase,text-phrase-slop2
    env:
      EXAMPLES: ${{ matrix.examples }}
      SHAPES: ${{ matrix.shapes }}
      HOTROW: ${{ matrix.hotrow }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The .debs the valgrind-debs job saved for this image (or, on a new image, the newest
      # entry for an older one), installed through dpkg with no network; apt when there are
      # none or they don't install (scripts/install-valgrind.sh). A notice names the source.
      # The key is computed here, not taken from that job: this runner's image can differ.
      - id: debs-key
        run: |
          echo "key=callgrind-debs-v1-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
          echo "prefix=callgrind-debs-v1-${ImageOS}-" >> "$GITHUB_OUTPUT"
      - id: debs
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: /tmp/valgrind-debs
          key: ${{ steps.debs-key.outputs.key }}
          restore-keys: ${{ steps.debs-key.outputs.prefix }}
      - name: install valgrind
        timeout-minutes: 8
        env:
          DEBS_KEY: ${{ steps.debs-key.outputs.key }}
          DEBS_MATCHED: ${{ steps.debs.outputs.cache-matched-key }}
        run: scripts/install-valgrind.sh cached /tmp/valgrind-debs
      - name: build the examples (head and base)
        shell: bash
        run: |
          set -euo pipefail
          # A PR checks out GitHub's merge of the head into the current main, which may be
          # newer than the event's base.sha: the merge's first parent is exactly the main it
          # was built on, so the table shows only the PR's own change.
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            base="$(git rev-parse HEAD^1)"
          else
            base=origin/main
          fi
          flags=() srcs=()
          for e in $EXAMPLES; do
            flags+=(--example "$e")
            srcs+=("crates/bench/examples/$e.rs")
          done
          mkdir -p /tmp/bin-head /tmp/bin-base
          # Default features of every crate, always: the counts must be what a user of the
          # published crates gets (#430: `pigeonhole`'s default-on `async` adds a second,
          # cache-only instance of the read paths). Never pass --no-default-features or
          # --features here, and keep the bench's dependencies on their default features.
          cargo build --release -p pigeonhole-bench "${flags[@]}"
          for e in $EXAMPLES; do cp "target/release/examples/$e" /tmp/bin-head/; done
          git worktree add -q /tmp/base "$base"
          cp "${srcs[@]}" /tmp/base/crates/bench/examples/
          # Shared example modules (the `Measured` guard), also at the head's version.
          cp -R crates/bench/examples/support /tmp/base/crates/bench/examples/
          # A PR whose new shapes use an API it adds (D314's commit_returning) can't build the
          # head's examples against base: base then builds its own, and runs only the shapes it
          # has a ceiling for. The new shapes show as new, with no base count.
          if ! (cd /tmp/base && cargo build --release -p pigeonhole-bench "${flags[@]}" \
            --target-dir "$GITHUB_WORKSPACE/target"); then
            # Shapes whose example code differs from base's are then compared across different
            # code: name the files, and the count step marks their shapes not comparable.
            git diff --name-only "$base" HEAD -- crates/bench/examples > /tmp/examples-differ
            echo "::notice::base can't build the head's examples (they use an API this PR adds): base runs its own examples; files that differ: $(tr '\n' ' ' < /tmp/examples-differ)"
            git -C /tmp/base checkout -q -- crates/bench/examples
            (cd /tmp/base && cargo build --release -p pigeonhole-bench "${flags[@]}" \
              --target-dir "$GITHUB_WORKSPACE/target")
            touch /tmp/base-own-examples
          fi
          for e in $EXAMPLES; do cp "target/release/examples/$e" /tmp/bin-base/; done
      - name: count
        shell: bash
        run: |
          set -euo pipefail
          for side in base head; do
            groups=()
            for g in $SHAPES; do
              # Base on its own examples: only the shapes base has a ceiling for.
              if [ "$side" = base ] && [ -e /tmp/base-own-examples ]; then
                keep=()
                IFS=, read -ra list <<< "${g#*:}"
                for s in "${list[@]}"; do
                  if awk -v s="$s" '$1 == s { f = 1 } END { exit !f }' \
                    /tmp/base/crates/bench/baselines/instruction-ceilings.txt; then
                    keep+=("$s")
                  fi
                done
                [ "${#keep[@]}" -gt 0 ] || continue
                g="${g%%:*}:$(IFS=,; echo "${keep[*]}")"
              fi
              groups+=("/tmp/bin-$side/$g")
            done
            # The text shapes' index, built natively once per side (about 25 s) and opened
            # read-only by every text shape: valgrind runs only the searches (#1560 PR 0). The
            # build pins its clock and ids, so each side indexes the same bytes of text into
            # the same layout. It also checks the corpus (the hub term's postings).
            if [ -x "/tmp/bin-$side/textshapes" ]; then
              "/tmp/bin-$side/textshapes" build "/tmp/textidx-$side"
              export TEXTSHAPES_INDEX="/tmp/textidx-$side"
            else
              unset TEXTSHAPES_INDEX
            fi
            hot="/tmp/bin-$side/$HOTROW"
            [ "$HOTROW" = - ] && hot=-
            scripts/instructions-per-cell.sh "$hot" "${groups[@]}" > "/tmp/$side.txt"
          done
          if [ ! -s /tmp/base.txt ] || [ ! -s /tmp/head.txt ]; then
            echo "a side counted nothing: base $(wc -l < /tmp/base.txt) lines, head $(wc -l < /tmp/head.txt)"
            exit 1
          fi
          # With base on its own examples: the binaries whose example files differ (every
          # binary if a shared module under support/ does). Their shapes, and hotrow's states
          # for hotrow, are compared across different code, so they are marked, not checked.
          : > /tmp/differ-bins
          if [ -e /tmp/base-own-examples ]; then
            if grep -q '^crates/bench/examples/support/' /tmp/examples-differ; then
              echo ALL > /tmp/differ-bins
            else
              sed -n 's|^crates/bench/examples/\([^/]*\)\.rs$|\1|p' /tmp/examples-differ > /tmp/differ-bins
            fi
          fi
          : > /tmp/shape-bins
          for g in $SHAPES; do
            IFS=, read -ra list <<< "${g#*:}"
            for s in "${list[@]}"; do echo "$s ${g%%:*}" >> /tmp/shape-bins; done
          done
          # Base and head by name: `name base head flag`, base `-` for a shape new in the head,
          # flag `x` for one whose example code differs from base's.
          awk 'FILENAME == ARGV[1] { d[$1] = 1; next }
               FILENAME == ARGV[2] { bin[$1] = $2; next }
               FILENAME == ARGV[3] { b[$1] = $2; next }
               { e = ($1 in bin) ? bin[$1] : "hotrow"
                 print $1, (($1 in b) ? b[$1] : "-"), $2, (("ALL" in d) || (e in d)) ? "x" : "-" }' \
            /tmp/differ-bins /tmp/shape-bins /tmp/base.txt /tmp/head.txt > /tmp/pairs.txt
          {
            echo "### Instructions per unit (callgrind)"
            echo
            echo "Hot row (\`hotrow.rs\`, row read + 10-row scan): per cell. Shapes: per unit as each example documents (\`readshapes.rs\`: per point get, or per returned cell)."
            echo
            echo "| State or shape | base | head | change |"
            echo "|---|--:|--:|--:|"
            if [ -s /tmp/differ-bins ]; then
              echo "Base ran its own examples (the head's use an API this PR adds). Example files that differ from base: $(tr '\n' ' ' < /tmp/examples-differ). Their existing shapes are compared across different example code: marked, not checked."
              echo
            fi
            while read -r state b h flag; do
              if [ "$b" = - ]; then
                echo "| $state | (new) | $h | new |"
              elif [ "$flag" = x ]; then
                echo "| $state | $b | $h | not comparable (example changed) |"
              else
                echo "| $state | $b | $h | $(awk -v b="$b" -v h="$h" 'BEGIN { printf "%+.1f%%", 100 * (h - b) / b }') |"
              fi
            done < /tmp/pairs.txt
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # The head must also stay at or below every shape's absolute ceiling (D193): the
          # Phase 2 floors may not regress, not even in steps below the per-PR thresholds.
          {
            echo
            echo "### Absolute ceilings (D193, crates/bench/baselines/instruction-ceilings.txt)"
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ceilings=0
          python3 scripts/instruction-ceilings.py check /tmp/head.txt | tee -a "$GITHUB_STEP_SUMMARY" || ceilings=1
          awk -v thresholds="$THRESHOLDS" '
            BEGIN {
              n = split(thresholds, kv, " ")
              for (i = 1; i <= n; i++) { split(kv[i], p, "="); limit[p[1]] = p[2] }
            }
            # A shape new in the head has no base to compare, and one whose example code
            # differs from base's isn't like for like; their absolute ceilings still hold.
            $2 == "-" || $4 == "x" { next }
            {
              t = ($1 in limit) ? limit[$1] : limit["default"]
              if ($3 > $2 * (1 + t / 100)) {
                printf "regression: %s %s -> %s (%+.2f%%, threshold %s%%)\n", $1, $2, $3, 100 * ($3 - $2) / $2, t
                bad = 1
              }
            }
            END { exit bad }' /tmp/pairs.txt
          if [ "$ceilings" != 0 ]; then
            echo "a shape is above its absolute ceiling, or has none (D193)"
            exit 1
          fi
