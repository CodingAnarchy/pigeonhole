name: Publish to RubyGems

# Pushes the pigeonhole-db gems (ruby-gems.yml: seven precompiled platform gems and the source
# gem) to RubyGems on a release tag (#697, ICR 0111). Trusted publishing: the push
# authenticates with this run's OIDC token, so no API key is stored anywhere. The publish job
# runs in the `rubygems` environment, whose required reviewer (the owner) approves each
# release before anything is pushed. The gem is `pigeonhole-db` (owner decision 2026-11-04:
# RubyGems refused `pigeonhole`); it's still required as "pigeonhole".
#
# Owner setup, once, before the first release tag:
#   - Settings → Environments → `rubygems`: add the owner as required reviewer, and limit
#     deployments to tags matching `v*`.
#   - rubygems.org: a trusted publisher for gem `pigeonhole-db`: repository
#     CodingAnarchy/pigeonhole, workflow publish-rubygems.yml, environment rubygems.
#
# Trusted publishing can't create a new gem unless the token exchange names the owning
# account, and configure-rubygems-credentials (v2.1.0) has no `owner` input. So 1.1.0, the
# first version, was pushed by hand by the owner from this workflow's built gems (run
# 41880205614), and the trusted publisher is then added on the existing gem. Every later tag
# publishes here. A new gem (another name) needs the same first manual push.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ruby-gems.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: rubygems
      url: https://rubygems.org/gems/pigeonhole-db
    permissions:
      contents: read
      id-token: write  # trusted publishing; this job only
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - uses: actions/download-artifact@v4
        with:
          pattern: gem-*
          path: pkg
          merge-multiple: true
      # Every gem must carry the tag's version: a tag pushed on a commit whose
      # Pigeonhole::VERSION wasn't bumped stops here, before the push.
      - name: The gems match the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          ls -l pkg
          shopt -s nullglob
          gems=(pkg/*.gem)
          [ "${#gems[@]}" -eq 8 ] || { echo "expected 8 gems (7 platforms + source), got ${#gems[@]}"; exit 1; }
          for g in "${gems[@]}"; do
            case "$(basename "$g")" in
              pigeonhole-db-"$version".gem|pigeonhole-db-"$version"-*.gem) ;;
              *) echo "$g does not match version $version"; exit 1 ;;
            esac
          done
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      # The platform gems first, the source gem last: until the source gem is up, a platform
      # without a precompiled gem resolves to the previous release, never to a half-published
      # one.
      - name: Push the gems
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for g in pkg/pigeonhole-db-"$version"-*.gem; do gem push "$g"; done
          gem push pkg/pigeonhole-db-"$version".gem
