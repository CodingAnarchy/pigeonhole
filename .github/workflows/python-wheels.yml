name: Python wheels

# abi3 wheels (CPython 3.11 and later) for every platform the bindings support, and the
# sdist, as artifacts (#696). Nothing is uploaded to PyPI: the first publish is the owner's
# call, and gets its own workflow.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.lock'
      - '.github/workflows/python-wheels.yml'
  pull_request:
    paths:
      - 'crates/python/Cargo.toml'
      - 'crates/python/pyproject.toml'
      - '.github/workflows/python-wheels.yml'
  workflow_dispatch:

jobs:
  wheels:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux x86_64, os: ubuntu-latest, target: x86_64, manylinux: '2014' }
          - { name: manylinux aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: '2014' }
          - { name: musllinux x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macOS universal2, os: macos-latest, target: universal2-apple-darwin, manylinux: '' }
          - { name: Windows x86_64, os: windows-latest, target: x64, manylinux: '' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: The wheel installs and imports
        if: matrix.manylinux != 'musllinux_1_2'
        shell: bash
        run: |
          python -m pip install --quiet crates/python/dist/*.whl
          python -c "import pigeonhole as ph; print(ph.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: crates/python/dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/python/dist/*.tar.gz
