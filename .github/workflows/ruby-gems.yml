name: Ruby gems

# Precompiled native gems for every platform the bindings support, and the source gem that
# compiles on any other, as artifacts (#697, ICR 0111). Nothing is pushed to RubyGems here:
# publish-rubygems.yml calls this workflow on a release tag and pushes what it builds.

on:
  # Seven cross-compiles: on changes to the gem itself, weekly for everything under it (the
  # engine), on demand, and from publish-rubygems.yml on a release tag, rather than on every
  # push to main (ai1249's P1 on #1399). A pull request builds them only when it touches the
  # gem tooling.
  push:
    branches: [main]
    paths:
      - 'crates/ruby/**'
      - '.github/workflows/ruby-gems.yml'
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    paths:
      - 'crates/ruby/Cargo.toml'
      - 'crates/ruby/pigeonhole.gemspec'
      - 'crates/ruby/Rakefile'
      - 'crates/ruby/extconf.rb'
      - 'crates/ruby/Gemfile*'
      - 'crates/ruby/rakelib/**'
      - 'crates/ruby/script/**'
      - '.github/workflows/ruby-gems.yml'
  workflow_dispatch:
  workflow_call:

# A newer push to a pull request cancels its superseded run. On main a run is never cancelled
# (with merges landing faster than a run, main would never finish one); GitHub keeps only the
# newest queued run per group, so main holds at most one running and one waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native:
    name: native gem (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - aarch64-linux
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-darwin
          - arm64-darwin
          - x64-mingw-ucrt
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: crates/ruby
      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: '3.3,3.4,4.0'
          working-directory: crates/ruby
      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}
          if-no-files-found: error

  # The source gem (rakelib/source_gem.rake): the engine's path crates vendored under vendor/.
  # It's installed from a copy outside the checkout into an empty GEM_HOME, which compiles it
  # as a user's `gem install` would, so a file the vendored crates need but don't carry fails
  # here, not on a user's machine (ai1249's P2 on #697; the merge job waits for it).
  source:
    name: source gem (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: crates/ruby
      - name: Build the source gem
        working-directory: crates/ruby
        run: bundle exec rake gem:source
      - name: Install it outside the checkout and smoke-test it
        shell: bash
        run: |
          out="$RUNNER_TEMP/source-gem"
          mkdir -p "$out/home"
          cp crates/ruby/pkg/source/pigeonhole-*.gem crates/ruby/script/source_gem_smoke.rb "$out/"
          cd "$out"
          export GEM_HOME="$out/home" GEM_PATH="$out/home"
          gem install --no-document ./pigeonhole-*.gem
          ruby source_gem_smoke.rb
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: gem-source
          path: crates/ruby/pkg/source/pigeonhole-*.gem
          if-no-files-found: error
