name: Ruby

# The Ruby bindings (#697, ICR 0111): build the native extension, run the Minitest suite
# (under RBS's runtime type checking where it works), validate the RBS signatures (the API's
# snapshot) and check every public method has one. Native gems for every platform are
# ruby-gems.yml.

on:
  # On main only for the bindings themselves (or a dependency change that can leave
  # crates/ruby/Cargo.lock stale): an engine change runs here on its pull request, and the
  # weekly ruby-gems.yml build covers the engine under the gem.
  push:
    branches: [main]
    paths:
      - 'crates/ruby/**'
      - 'Cargo.lock'
      - '.github/workflows/ruby.yml'
  pull_request:
    paths:
      - 'crates/ruby/**'
      - 'crates/pigeonhole/src/**'
      # An engine dependency change can leave crates/ruby/Cargo.lock stale.
      - 'Cargo.lock'
      - '.github/workflows/ruby.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # rake compile builds into crates/ruby/target (not under tmp/), which rust-cache keeps.
  RB_SYS_CARGO_TARGET_DIR: ${{ github.workspace }}/crates/ruby/target

# A newer push to a pull request cancels its superseded run. On main a run is never cancelled
# (with merges landing faster than a run, main would never finish one); GitHub keeps only the
# newest queued run per group, so main holds at most one running and one waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: minitest (${{ matrix.os }}, Ruby ${{ matrix.ruby }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ruby (3.3, the owner's floor) on every OS, and the newest
          # on Linux and macOS.
          - { os: ubuntu-latest, ruby: '3.3' }
          - { os: macos-latest, ruby: '3.3' }
          - { os: windows-latest, ruby: '3.3' }
          - { os: ubuntu-latest, ruby: '4.0' }
          - { os: macos-latest, ruby: '4.0' }
    defaults:
      run:
        working-directory: crates/ruby
    steps:
      - uses: actions/checkout@v5
      # Ruby, Rust and the cache together (oxidize-rb, rb-sys's maintainers): on Windows it
      # sets up the MinGW toolchain RubyInstaller's Ruby needs and points bindgen at MSYS2's
      # headers, which plain setup-ruby plus rustup don't.
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: crates/ruby
          rustup-components: clippy, rustfmt
          # The cache-clean step downloads cargo-binstall from GitHub releases with plain
          # `curl -sSL` (no --fail), so an error page fails its checksum and the whole job
          # (2026-11-09: every Ruby job on #1614, and #1552's macOS run before). Trimming the
          # cache isn't worth that.
          cargo-cache-clean: false
      # crates/ruby keeps its own Cargo.lock, which an engine dependency change elsewhere can
      # leave stale. `rake compile` doesn't pass --locked and would quietly rewrite it, so
      # check it first (#1366's crc-fast drifted it unnoticed).
      - name: Cargo.lock is current
        working-directory: crates/ruby
        # bash on every runner: Windows' default PowerShell reads /dev/null as a path.
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Compile the extension
        run: bundle exec rake compile
        # With the tests' hold seams (`test-hooks`, #1574); the gems are built without them.
        env:
          PIGEONHOLE_TEST_HOOKS: '1'
      # crates/ruby is a workspace of its own (the root's `cargo --workspace` jobs don't see it):
      # lint, document and licence-check it here, once.
      - name: clippy, rustdoc and fmt
        if: matrix.os == 'ubuntu-latest' && matrix.ruby == '3.3'
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features test-hooks -- -D warnings
          cargo doc --locked --no-deps
          cargo fmt --check
      - uses: taiki-e/install-action@v2
        if: matrix.os == 'ubuntu-latest' && matrix.ruby == '3.3'
        with:
          tool: cargo-deny
      - name: cargo deny (the root's deny.toml)
        if: matrix.os == 'ubuntu-latest' && matrix.ruby == '3.3'
        run: cargo deny --config ../../deny.toml check
      - name: Minitest
        run: bundle exec rake test
      - name: Minitest under RBS runtime type checking (sig/pigeonhole.rbs)
        run: bundle exec rake test:rbs
      - name: RBS signatures validate
        run: bundle exec rbs -I sig validate
