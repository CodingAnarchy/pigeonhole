[workspace]
resolver = "3"
members = [
    "crates/format",
    "crates/io",
    "crates/sim",
    "crates/pager",
    "crates/wal",
    "crates/memtable",
    "crates/cache",
    "crates/runtime",
    "crates/shm",
    "crates/sst",
    "crates/compaction",
    "crates/engine",
    "crates/pigeonhole",
    "crates/bench",
    "crates/arrow",
    "crates/cli",
    "crates/capi",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/CodingAnarchy/pigeonhole"
authors = ["Matt Tanous <matt.tanous@hey.com>"]
keywords = ["database", "wide-column", "embedded", "lsm", "bigtable"]
categories = ["database-implementations", "data-structures"]

[workspace.dependencies]
pigeonhole-format = { path = "crates/format", version = "0.2.0" }
pigeonhole-io = { path = "crates/io", version = "0.2.0" }
pigeonhole-sim = { path = "crates/sim", version = "0.2.0" }
pigeonhole-pager = { path = "crates/pager", version = "0.2.0" }
pigeonhole-wal = { path = "crates/wal", version = "0.2.0" }
pigeonhole-memtable = { path = "crates/memtable", version = "0.2.0" }
pigeonhole-cache = { path = "crates/cache", version = "0.2.0" }
pigeonhole-runtime = { path = "crates/runtime", version = "0.2.0" }
pigeonhole-shm = { path = "crates/shm", version = "0.2.0" }
pigeonhole-sst = { path = "crates/sst", version = "0.2.0" }
pigeonhole-compaction = { path = "crates/compaction", version = "0.2.0" }
pigeonhole-engine = { path = "crates/engine", version = "0.2.0" }
pigeonhole = { path = "crates/pigeonhole", version = "0.2.0" }
pigeonhole-bench = { path = "crates/bench", version = "0.2.0" }
pigeonhole-arrow = { path = "crates/arrow", version = "0.2.0" }
pigeonhole-cli = { path = "crates/cli", version = "0.2.0" }
pigeonhole-capi = { path = "crates/capi", version = "0.2.0" }

# External dependencies. Each one is justified in docs/design/interfaces.md.
crc32c = "0.6"
foldhash = "0.2"
twox-hash = { version = "2", default-features = false, features = ["std", "xxhash3_64"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
zstd = { version = "0.13", default-features = false }
arc-swap = "1"
smallvec = "1"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Threading"] }
# Dev-only.
proptest = "1"
loom = "0.7"
criterion = "0.8"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(pigeonhole_sim)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "warn"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"

# The simulation suites (engine tablets/model_check, wal stream, ...) are CPU-bound; a
# light optimisation level makes them several times faster. Debug assertions and
# overflow checks stay on (they catch real bugs); only codegen is optimised.
[profile.dev]
opt-level = 1
