[workspace]
resolver = "3"
members = [
    "crates/format",
    "crates/io",
    "crates/sim",
    "crates/pager",
    "crates/wal",
    "crates/memtable",
    "crates/cache",
    "crates/runtime",
    "crates/shm",
    "crates/sst",
    "crates/compaction",
    "crates/engine",
    "crates/pigeonhole",
    "crates/bench",
    "crates/arrow",
    "crates/cli",
    "crates/capi",
    "crates/vector",
    "crates/python",
    "crates/text",
    "crates/memory",
    "crates/otel",
    "crates/embed",
    "examples/serving",
]
# The Ruby bindings are a workspace of their own: building them needs a Ruby with headers
# (rb-sys), which `cargo build --workspace` mustn't require (#697, ICR 0111).
exclude = ["crates/ruby"]

[workspace.package]
# The public version line (D295): `pigeonhole`, `pigeonhole-arrow`, `pigeonhole-cli`,
# `pigeonhole-vector`, `pigeonhole-text` and `pigeonhole-memory`,
# which follow semver from 1.0; the unpublished `pigeonhole-capi` and `pigeonhole-bench` take
# the public line's version too. The 12 internal crates set their own `version`: one shared
# internal line, which takes a new major for any incompatible change to any of them.
# `scripts/versions.py check` (CI) keeps each line and every pin below in step.
version = "1.2.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/CodingAnarchy/pigeonhole"
authors = ["Matt Tanous <matt.tanous@hey.com>"]
keywords = ["database", "wide-column", "embedded", "lsm", "bigtable"]
categories = ["database-implementations", "data-structures"]

[workspace.dependencies]
# The internal crates are pinned exactly (D282) at the internal line's version (D295):
# `pigeonhole` is the stable API, and the internal crates may change incompatibly in any
# release (the internal line's major then), so a build of one `pigeonhole` release always gets
# the internal crates it was tested with.
pigeonhole-format = { path = "crates/format", version = "=3.0.1" }
pigeonhole-io = { path = "crates/io", version = "=3.0.1" }
pigeonhole-sim = { path = "crates/sim", version = "=3.0.1" }
pigeonhole-pager = { path = "crates/pager", version = "=3.0.1" }
pigeonhole-wal = { path = "crates/wal", version = "=3.0.1" }
pigeonhole-memtable = { path = "crates/memtable", version = "=3.0.1" }
pigeonhole-cache = { path = "crates/cache", version = "=3.0.1" }
pigeonhole-runtime = { path = "crates/runtime", version = "=3.0.1" }
pigeonhole-shm = { path = "crates/shm", version = "=3.0.1" }
pigeonhole-sst = { path = "crates/sst", version = "=3.0.1" }
pigeonhole-compaction = { path = "crates/compaction", version = "=3.0.1" }
pigeonhole-engine = { path = "crates/engine", version = "=3.0.1" }
pigeonhole = { path = "crates/pigeonhole", version = "1.2.1" }
pigeonhole-bench = { path = "crates/bench", version = "1.2.1" }
pigeonhole-arrow = { path = "crates/arrow", version = "1.2.1" }
pigeonhole-cli = { path = "crates/cli", version = "1.2.1" }
pigeonhole-vector = { path = "crates/vector", version = "1.2.1" }
pigeonhole-text = { path = "crates/text", version = "1.2.1" }
pigeonhole-memory = { path = "crates/memory", version = "1.2.1" }
pigeonhole-capi = { path = "crates/capi", version = "1.2.1" }
# Its own 0.N line (D316): it follows opentelemetry's minor releases.
pigeonhole-otel = { path = "crates/otel", version = "0.1.0" }
pigeonhole-embed = { path = "crates/embed", version = "0.1.0" }

# External dependencies. Each one is justified in docs/design/interfaces.md.
# `std` (which needs `alloc`): without it the crate is `no_std` and wants a panic handler.
crc-fast = { version = "1.10", default-features = false, features = ["std"] }
foldhash = "0.2"
getrandom = "0.3"
twox-hash = { version = "2", default-features = false, features = ["std", "xxhash3_64"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
zstd = { version = "0.14.3", default-features = false }
arc-swap = "1"
futures-core = { version = "0.3", default-features = false }
smallvec = "1"
unicode-normalization = "0.1"
# Its Unicode version is in pigeonhole-text's tokeniser fingerprint (UAX #29 changes between
# versions): a bump that moves it makes existing text indexes refuse to open until `repair`.
unicode-segmentation = "1"
levenshtein_automata = "0.2.1"
libc = "0.2"
io-uring = "0.7.15"
# Arrow export (pigeonhole-arrow, and phdb dump --format arrow): one arrow-rs major, pinned (#691).
arrow-array = { version = "60", default-features = false }
arrow-buffer = { version = "60", default-features = false }
arrow-ipc = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
# phdb's JSON output, fields in their documented order (the bench writes JSON with it too).
serde_json = { version = "1", features = ["preserve_order"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Threading"] }
# pigeonhole-otel (D316): the API crate only, for the `Meter` an application hands it; one
# opentelemetry minor at a time, which pigeonhole-otel's own 0.N line follows.
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
# pigeonhole-embed (D318, ICR 0119): BERT inference on the CPU, with no C or C++ (candle's
# default backend; tokenizers without `onig` or `esaxx-rs`'s `cpp`). One candle minor at a time.
candle-core = { version = "0.11.1", default-features = false }
candle-nn = { version = "0.11.1", default-features = false }
candle-transformers = { version = "0.11.1", default-features = false }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
rayon = "1"
sha2 = "0.10"
# Dev-only.
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "testing"] }
opentelemetry-prometheus = "0.33"
prometheus = { version = "0.14", default-features = false }
proptest = "1"
half = { version = "2.7", default-features = false }
loom = "0.7"
criterion = "0.8"
rustix = { version = "1", default-features = false, features = ["std", "time"] }

# Local disk budget for target/ (cargo-quota; cargo ignores this table). One pool across
# every git worktree of the repo, pruned least recently used first; anything used within
# the last hour is kept. Not used by CI.
[workspace.metadata.quota]
percent = 2
worktrees = true
min-age = "1h"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(engine_loom)", "cfg(io_loom)", "cfg(pigeonhole_sim)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "warn"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"

# The simulation suites (engine tablets/model_check, wal stream, ...) are CPU-bound; a
# light optimisation level makes them several times faster. Debug assertions and
# overflow checks stay on (they catch real bugs); only codegen is optimised.
[profile.dev]
opt-level = 1
