[package]
name = "pigeonhole-arrow"
description = "Arrow RecordBatch export for Pigeonhole scans."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# The public crate only (spec Risks: query features build on the core, never the reverse).
pigeonhole = { workspace = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-schema = { workspace = true }

[features]
# The Arrow C stream interface (`ArrowScan::into_ffi_stream`): hands a stream to a consumer
# built on another arrow major or another language (DuckDB, Polars, pyarrow). Adds libc.
ffi = ["arrow-array/ffi"]

# docs.rs builds default features only: document `into_ffi_stream` too.
[package.metadata.docs.rs]
features = ["ffi"]

[dev-dependencies]
# The tests use pigeonhole's test hooks (`Options::wal_segment_size`, ICR 0085).
pigeonhole = { workspace = true, features = ["__unstable-hooks"] }
pigeonhole-io = { workspace = true }

[lints]
workspace = true
