[package]
name = "pigeonhole-bench"
description = "Benchmark workloads and comparison runners for Pigeonhole."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish = false

[[bin]]
name = "phdb-bench"
path = "src/main.rs"

[features]
default = []
# Comparison runners. Off by default: they pull C/C++ builds (RocksDB, SQLite) or a
# second storage engine (fjall) into the build.
rocksdb = ["dep:rocksdb"]
sqlite = ["dep:rusqlite"]
fjall = ["dep:fjall"]

[dependencies]
pigeonhole = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rocksdb = { version = "0.25", default-features = false, optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
fjall = { version = "3", optional = true }

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }

[[example]]
name = "hotrow_runners"
required-features = ["sqlite"]
