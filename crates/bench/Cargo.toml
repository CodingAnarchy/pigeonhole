[package]
name = "pigeonhole-bench"
description = "Benchmark workloads and comparison runners for Pigeonhole."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish = false

[[bin]]
name = "phdb-bench"
path = "src/main.rs"

[features]
default = ["fixed-seed"]
# Comparison runners. Off by default: they pull C/C++ builds (RocksDB, SQLite) into the
# build.
rocksdb = ["dep:rocksdb"]
sqlite = ["dep:rusqlite"]
# Fixed hash seeds in the measured examples (#1273, `support/measure.rs`). On by default, so
# instructions.yml (which passes no features) gets it; a base from before #1273, built with
# the head's example sources, has no such feature and keeps random seeds.
fixed-seed = []

[dependencies]
# Default features (async included): the instruction counts measure what users get.
# The bench reads pigeonhole's test and bench hooks (ICR 0085).
pigeonhole = { workspace = true, features = ["__unstable-hooks"] }
# The fixed hash seeds of the measured examples (#1273): only adds the setter, no measured code.
pigeonhole-format = { workspace = true, features = ["__unstable-fixed-seed"] }
# D306 PR 3: the IVF index on SIFT1M (`examples/ivfsift.rs`).
pigeonhole-vector = { workspace = true }
# The default shard count (D220), for the D213 and scaling runs and the report.
pigeonhole-io = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
rocksdb = { version = "0.25", default-features = false, optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
# The `commitpath` example drives the engine's shards directly.
pigeonhole-engine = { workspace = true }
# The `coldscan` example counts what the scan readahead did.
pigeonhole-sst = { workspace = true }
# The `arrowexport` example measures the Arrow export (#691).
pigeonhole-arrow = { workspace = true }

