[package]
name = "pigeonhole-cli"
description = "phdb: the command-line tool for Pigeonhole databases: info, check, dump, load, backup, compact and an interactive shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[[bin]]
name = "phdb"
path = "src/main.rs"

[dependencies]
# The public crate only: phdb uses no engine internals (#692).
pigeonhole = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# dump --format arrow (#691): the export and its IPC stream.
pigeonhole-arrow = { workspace = true }
arrow-ipc = { workspace = true }

[dev-dependencies]
insta = { version = "1.49", features = ["filters"] }

[lints]
workspace = true
