[package]
name = "pigeonhole-cli"
description = "phdb: the command-line tool for Pigeonhole databases: info, check, dump, load, backup, compact, an interactive shell and an MCP server for AI agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
# phdb is a tool rather than a library: command-line-utilities instead of data-structures.
categories = ["database-implementations", "command-line-utilities"]
readme = "README.md"

[[bin]]
name = "phdb"
path = "src/main.rs"

[features]
default = ["embed"]
# `phdb mcp --embed-url` (D311 T7): an HTTPS client for an embedding endpoint. Without it,
# the memory tools take client-supplied embeddings or recall by keyword.
embed = ["dep:ureq", "dep:rustls", "dep:rustls-native-certs"]

[dependencies]
# The public crates only: phdb uses no engine internals (#692).
pigeonhole = { workspace = true }
# `phdb mcp --memory` (D311 T7).
pigeonhole-memory = { workspace = true }
# `--embed-url`: a synchronous HTTP client, rustls on the ring provider, and the operating
# system's trust store (no bundled roots: webpki-roots' licence isn't in deny.toml).
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
clap = { version = "4.6", features = ["derive"] }
serde_json = { workspace = true }
# dump --format arrow (#691): the export and its IPC stream.
pigeonhole-arrow = { workspace = true }
arrow-ipc = { workspace = true }

[dev-dependencies]
# The tests use pigeonhole's test hooks (`Options::wal_segment_size`, ICR 0085).
pigeonhole = { workspace = true, features = ["__unstable-hooks"] }
insta = { version = "1.49", features = ["filters"] }
# `tests/check_fixtures.rs` rewrites structures with valid checksums.
pigeonhole-format = { workspace = true }

[lints]
workspace = true
