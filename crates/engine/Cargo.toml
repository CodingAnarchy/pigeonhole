[package]
name = "pigeonhole-engine"
description = "The Pigeonhole storage engine: tablets, shards, MVCC, WAL, flush, compaction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
portable-atomic = "1"
pigeonhole-format = { workspace = true }
pigeonhole-io = { workspace = true }
pigeonhole-pager = { workspace = true }
pigeonhole-wal = { workspace = true }
pigeonhole-memtable = { workspace = true }
pigeonhole-cache = { workspace = true }
pigeonhole-runtime = { workspace = true }
pigeonhole-shm = { workspace = true }
pigeonhole-sst = { workspace = true }
pigeonhole-compaction = { workspace = true }
arc-swap = { workspace = true }
smallvec = { workspace = true }

[features]
# Test-only hooks (`src/engine/hooks.rs`), enabled by the dev-dependency below for the
# engine's own tests and benches; never by the public crate.
test-hooks = []

[dev-dependencies]
pigeonhole-sim = { workspace = true }
pigeonhole-engine = { path = ".", features = ["test-hooks"] }
criterion = { workspace = true }

# A test thread's CPU time (`tests/tablets.rs`), which other tests running beside it do not
# inflate as they do wall-clock time (#795).
[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true }

[[bench]]
name = "engine"
harness = false

[lints]
workspace = true

# The close gate's loom models (`close_gate`): `RUSTFLAGS="--cfg engine_loom" cargo test
# --release -p pigeonhole-engine --lib loom`. A cfg of its own, since `--cfg loom` would
# switch the dependencies that have loom models of their own too.
[target.'cfg(engine_loom)'.dependencies]
loom = { workspace = true }
