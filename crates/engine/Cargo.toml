[package]
name = "pigeonhole-engine"
description = "The Pigeonhole storage engine: tablets, shards, MVCC, WAL, flush, compaction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
pigeonhole-format = { workspace = true }
pigeonhole-io = { workspace = true }
pigeonhole-pager = { workspace = true }
pigeonhole-wal = { workspace = true }
pigeonhole-memtable = { workspace = true }
pigeonhole-cache = { workspace = true }
pigeonhole-runtime = { workspace = true }
pigeonhole-shm = { workspace = true }
pigeonhole-sst = { workspace = true }
pigeonhole-compaction = { workspace = true }
arc-swap = { workspace = true }
smallvec = { workspace = true }

[features]
# Test-only hooks (`src/engine/hooks.rs`), enabled by the dev-dependency below for the
# engine's own tests and benches; never by the public crate.
test-hooks = []

[dev-dependencies]
pigeonhole-sim = { workspace = true }
pigeonhole-engine = { path = ".", features = ["test-hooks"] }
criterion = { workspace = true }

[[bench]]
name = "engine"
harness = false

[lints]
workspace = true
