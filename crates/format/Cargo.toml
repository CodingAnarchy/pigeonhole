[package]
name = "pigeonhole-format"
description = "On-disk and shared-memory byte layouts for Pigeonhole: pure encode/decode, no I/O."
version = "2.0.0" # the internal version line (D295): scripts/versions.py
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
# Bench hook (#1273): `hash::fix_seed_for_measurement`, which fixes every hash map's seeds so
# callgrind counts one number per commit. Only `pigeonhole-bench` enables it. Hidden, outside
# the semver promise; never turn it on in an application (fixed seeds give up the flooding
# resistance of random ones).
__unstable-fixed-seed = []

[dependencies]
crc-fast = { workspace = true }
foldhash = { workspace = true }
# The f16 kernels' widen (#1306): `convert_to_f32_slice` uses F16C or NEON when the CPU has
# it, detected at run time (`std`), and an exact software widen otherwise. It keeps format
# free of `unsafe` (the coordinator's choice on #1306, as #1366 did for checksums).
half = { workspace = true, features = ["std"] }
twox-hash = { workspace = true }
lz4_flex = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "format"
harness = false

[lints]
workspace = true
