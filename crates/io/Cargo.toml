[package]
name = "pigeonhole-io"
description = "Vfs abstraction for Pigeonhole: files, aligned buffers, completions, pread pool and fault-injecting simulated backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
pigeonhole-format = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The io_uring backend (#402): Linux only; every use is in `src/uring/`.
io-uring = { workspace = true }

[target.'cfg(windows)'.dependencies]
# `Win32_Security` gates `CreateFileMappingW` (its signature names SECURITY_ATTRIBUTES).
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_System_SystemInformation"] }

# The ring wake's loom model (`ring_wake`): `RUSTFLAGS="--cfg io_loom" cargo test --release
# -p pigeonhole-io --lib loom`. A cfg of its own: `--cfg loom` would switch other crates'
# loom-only code too.
[target.'cfg(io_loom)'.dependencies]
loom = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "io"
harness = false
