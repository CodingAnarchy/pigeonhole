[package]
name = "pigeonhole-io"
description = "Vfs abstraction for Pigeonhole: files, aligned buffers, completions, pread pool and fault-injecting simulated backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
pigeonhole-format = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# `Win32_Security` gates `CreateFileMappingW` (its signature names SECURITY_ATTRIBUTES).
windows-sys = { workspace = true, features = ["Win32_Security"] }

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "io"
harness = false
