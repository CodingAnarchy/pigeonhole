[package]
name = "pigeonhole"
description = "Embedded, single-file, wide-column store: BigTable's data model with SQLite's deployment model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# The tests stay in the repository: the compatibility corpus under tests/corpus is most of the
# crate's size (about 29 MiB, and every release corpus adds more), and the published crate needs
# none of it.
exclude = ["tests/"]

[features]
# The async front door (`get_async`, `commit_async`, scan streams), default-on per the
# spec's "Sync and async" section (D17). `default-features = false` drops it and its
# `futures-core` dependency; the blocking API is unchanged either way.
default = ["async"]
async = ["dep:futures-core"]
# Test and bench hooks (ICR 0085): hidden methods and options the workspace's tests and the
# bench use, and the `PIGEONHOLE_IO` / `PIGEONHOLE_DIRECT` test variables. Not part of the
# API and outside the semver promise; never turn it on in an application.
__unstable-hooks = []
# The engine's own test hooks (`pigeonhole-engine/test-hooks`), reached through hidden
# methods for this crate's tests (#1504): hold and fault seams only. Only this crate's
# dev-dependency on itself turns it on; the bench's `__unstable-hooks` builds don't get it.
__engine-hooks = ["__unstable-hooks", "pigeonhole-engine/test-hooks"]

[dependencies]
pigeonhole-engine = { workspace = true }
pigeonhole-format = { workspace = true }
pigeonhole-io = { workspace = true }
pigeonhole-shm = { workspace = true }
smallvec = { workspace = true }
arc-swap = { workspace = true }
futures-core = { workspace = true, optional = true }

[dev-dependencies]
# This crate's own tests use its hooks.
pigeonhole = { path = ".", features = ["__unstable-hooks", "__engine-hooks"] }
# The engine's test hooks, for the unit tests that race a read (never in a normal build).
pigeonhole-engine = { workspace = true, features = ["test-hooks"] }
pigeonhole-sim = { workspace = true }
# The recovery tests fail and hold one stream's syncs by path.
pigeonhole-wal = { workspace = true }
futures-core = { workspace = true }
criterion = { workspace = true }
# `tests/inplace_reads.rs` compares async and sync reads over random data (#709).
proptest = { workspace = true }
# The app-owned io_uring test waits in `poll` on the shard's completion fd (#408).
libc = { workspace = true }
# The format corpus writes and checks the structures these crates build on the public API
# (`tests/corpus.rs`, the 1.1.0 release corpus). By path only, without a version, so
# `cargo publish` drops them: they publish after this crate.
pigeonhole-memory = { path = "../memory" }
pigeonhole-text = { path = "../text" }
pigeonhole-vector = { path = "../vector" }

[[bench]]
name = "public"
harness = false

[lints]
workspace = true
