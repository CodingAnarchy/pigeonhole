[package]
name = "compat-reader"
# The release it pins: main.rs reads it as `RELEASE`.
version = "1.0.0"
edition = "2024"
publish = false

# Its own workspace: CI's "main's files with 1.0.0" job builds it against the published
# 1.0.0 (FORMAT.md §13). Never a member of the main workspace, whose `pigeonhole` is the
# build under test.
[workspace]

[dependencies]
pigeonhole = "=1.0.0"

[features]
# compat-reader-1.1's: the value types 1.0.0 lacks. Declared here too, so `cfg(feature)`
# names a known feature in both builds.
v1_1 = []
