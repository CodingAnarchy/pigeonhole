[package]
name = "pigeonhole-python"
description = "Python bindings for Pigeonhole (PyPI: pigeonhole-db), over PyO3 (D307)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
pigeonhole = { workspace = true }
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }

[lints]
workspace = true
