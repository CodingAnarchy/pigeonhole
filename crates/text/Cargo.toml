[package]
name = "pigeonhole-text"
description = "Full-text search with BM25 and phrases for Pigeonhole, built on its public API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# The public crate only (spec Risks: query features build on the core, never the reverse;
# D309 is an index of ordinary rows and transactions).
pigeonhole = { workspace = true }
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }
levenshtein_automata = { workspace = true }

[features]
# `Search::run_async` and `run_with_stats_async` (#1560, ICR 0124), on `pigeonhole`'s async
# front door; default-on, as there.
default = ["async"]
async = ["pigeonhole/async"]

[lints]
workspace = true
