[package]
name = "pigeonhole-vector"
description = "An IVF vector index for Pigeonhole, built on its public API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# The public crate only (spec Risks: query features build on the core, never the reverse;
# D306 is an index of ordinary rows and transactions).
pigeonhole = { workspace = true }

[lints]
workspace = true

[features]
# Hold and fault seams for this crate's tests (`hooks`, as ICR 0085's): hidden, outside the
# semver promise; never turn it on in an application.
__unstable-hooks = []

[dev-dependencies]
pigeonhole-vector = { path = ".", features = ["__unstable-hooks"] }
