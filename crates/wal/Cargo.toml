[package]
name = "pigeonhole-wal"
description = "Per-shard write-ahead log streams for Pigeonhole: recycled segments, group commit, 2PC records."
version = "2.0.0" # the internal version line (D295): scripts/versions.py
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
pigeonhole-io = { workspace = true }
pigeonhole-format = { workspace = true }

[features]
# Marks foreground WAL calls for the simulator's foreground-only scheduled faults
# (`FaultPlan::fail_on_foreground`, #990). Test builds only: the engine's `test-hooks`
# enables it.
sim-hooks = []

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "wal"
harness = false

[lints]
workspace = true
