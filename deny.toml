[graph]
all-features = true

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0"]
confidence-threshold = 0.9

# Scoped to pigeonhole-bench only: these two crates enter the graph solely through
# fjall, behind pigeonhole-bench's off-by-default `fjall` feature, and pigeonhole-bench
# is publish = false, so they never ship in a published crate. Both licenses are
# permissive and MIT-compatible. Each exception names one crate, not a workspace-wide
# allow. A published crate that pulls either one in needs its own review (D6;
# docs/design/questions/bench.md).
[[licenses.exceptions]]
crate = "varint-rs"
allow = ["0BSD"]

[[licenses.exceptions]]
crate = "xxhash-rust"
allow = ["BSL-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
