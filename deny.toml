[graph]
all-features = true

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0"]
confidence-threshold = 0.9

# fjall, behind pigeonhole-bench's off-by-default `fjall` feature (bench is
# publish = false), needs these two. Both licenses are permissive and MIT-compatible;
# the exceptions are scoped to the crates (docs/design/questions/bench.md).
[[licenses.exceptions]]
crate = "varint-rs"
allow = ["0BSD"]

[[licenses.exceptions]]
crate = "xxhash-rust"
allow = ["BSL-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
