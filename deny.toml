[graph]
all-features = true

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
ignore = [
  # `paste` is unmaintained, with no vulnerability: a build-time proc macro that `gemm` (under
  # candle, pigeonhole-embed only) pulls in. Owner, 2026-11-05: D318 Q3. Drop this once gemm
  # no longer depends on it.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time macro via gemm (pigeonhole-embed); D318 Q3" },
]
