// Pigeonhole's network API, v1 (D313, ICR 0112): health, information, maintenance, backup
// and metrics.
syntax = "proto3";

package pigeonhole.v1;

import "pigeonhole/v1/common.proto";

service Admin {
  // Liveness. Needs no token, and says nothing but that the server answers.
  rpc Health(Empty) returns (HealthResponse);
  // The database's file, size and tables (read scope).
  rpc Info(Empty) returns (InfoResponse);
  // Admin scope from here on.
  rpc Flush(Empty) returns (Empty);
  rpc Compact(Empty) returns (Empty);
  // Writes a consistent backup to `path`, inside the server's `--backup-dir`.
  rpc Backup(BackupRequest) returns (BackupResponse);
  // A fresh consistent backup, streamed as the file's bytes.
  rpc BackupDownload(BackupDownloadRequest) returns (stream BackupChunk);
  // The metrics in Prometheus text format, under D316's names (read scope).
  rpc Metrics(Empty) returns (MetricsResponse);
}

message HealthResponse {
  // "ok" while the database is open and not failed.
  string status = 1;
}

message InfoResponse {
  // The path the server opened, as given.
  string path = 1;
  uint64 file_bytes = 2;
  uint64 free_bytes = 3;
  repeated string tables = 4;
  // The server's version (`pigeonhole`'s).
  string version = 5;
}

message BackupRequest {
  // Relative to the server's backup directory; it must not exist.
  string path = 1;
  // Only data durable at the writer's level (`backup_durable`).
  bool durable = 2;
}

message BackupResponse {
  uint64 bytes = 1;
}

message BackupDownloadRequest {
  bool durable = 1;
}

message BackupChunk {
  // The next bytes of the backup file, in order.
  bytes data = 1;
  // In the last chunk: the file's total size.
  uint64 total = 2;
}

message MetricsResponse {
  string text = 1;
}
