// Pigeonhole's network API, v1: static partitions across `phdb serve` nodes (D317, ICR 0117).
// The partition map, and the `Cluster` service that sets, distributes and reports it.
syntax = "proto3";

package pigeonhole.v1;

import "pigeonhole/v1/common.proto";
import "pigeonhole/v1/data.proto";
import "pigeonhole/v1/feed.proto";
import "pigeonhole/v1/memory.proto";
import "pigeonhole/v1/schema.proto";
import "pigeonhole/v1/text.proto";
import "pigeonhole/v1/transactions.proto";
import "pigeonhole/v1/vector.proto";

service Cluster {
  // The node's newest map. Read, admin or cluster scope.
  rpc GetMap(GetMapRequest) returns (ClusterMap);
  // Replaces the map: validated, persisted on this node, then pushed to every node in it.
  // Answers once it's persisted here, with what each push did (in parallel, each bounded by
  // `--cluster-push-timeout-ms`). `Conflict` (`ABORTED`, not applied) when
  // `expected_map_version` isn't this node's version: re-read the map and try again; the
  // message carries the current version. `InvalidArgument` for a map that fails validation
  // or makes a change the map may not make. Admin scope.
  rpc SetMap(SetMapRequest) returns (SetMapResponse);
  // Node to node: a newer map, accepted only from the same cluster with a greater
  // `map_version` and a valid change; the same version with the same bytes is a no-op.
  // `InvalidArgument` otherwise: older, another cluster's, an invalid change, or divergent
  // (the same version, different bytes, which `Status` then reports on both nodes).
  // Cluster scope, gRPC only.
  rpc PushMap(PushMapRequest) returns (PushMapResponse);
  // This node: its id, its map version and the partitions in its directory. Read, admin or
  // cluster scope.
  rpc Status(StatusRequest) returns (NodeStatus);
  // `phdb cluster txn decide` (D329): decides a share held in doubt on this node's partition,
  // for a transaction whose home will never answer. Admin or cluster scope. It can break the
  // transaction's atomicity, so without `force` it's refused while the home answers. Answers
  // the partition's status line.
  rpc DecideTxn(DecideTxnRequest) returns (LocalPartition);
  // Node to node (D317 ticket 2): a single-key call the sending node routed to this one, for
  // the caller it names, whose scope and namespaces this node checks again. This node
  // serves it only if its own map gives it the key; otherwise `WrongPartition` with its
  // `map_version`, and it never forwards it on (the sending node pulls the map and forwards
  // once more). Every other answer is the call's own, as a single node gives it. Cluster
  // scope, gRPC only.
  rpc Forward(ForwardRequest) returns (ForwardResponse);
  // Node to node (D317 ticket 4): one partition's part of a scan the sending node fans out,
  // for the caller it names, as this node's own `Data.Scan` stream of it. This node serves
  // it only if its map gives it `partition` and it has the partition open; otherwise
  // `WrongPartition` with its `map_version`. Cluster scope, gRPC only.
  rpc ForwardScan(ForwardScanRequest) returns (stream ScanPage);
  // Node to node (D317 ticket 7): one partition's part of a cluster subscription, which the
  // sending node merges with the others. Served only if this node's map gives it the
  // partition, and only on connections of their own (never the `Forward` pool), so a
  // subscriber that stops reading can't stall forwarded calls. The events are a single
  // node's: a token on every one, no `partition`. Cluster scope, gRPC only.
  rpc ForwardSubscribe(ForwardSubscribeRequest) returns (stream FeedEvent);
  // Node to node (#1915, ICR 0139): one partition's part of a `Memory.Watch` whose
  // namespaces are on several partitions, which the sending node merges with the others.
  // Served as `ForwardSubscribe` is: only if this node's map gives it the partition, on
  // connections of their own, and with the stream ending `PartitionUnavailable` when the
  // partition's lease lapses or it closes. The events are a single node's. Cluster scope,
  // gRPC only.
  rpc ForwardMemoryWatch(ForwardMemoryWatchRequest) returns (stream MemoryEvent);
  // Node to node (#1722 PR 3, ICR 0138): one partition's part of a `Vectors.BulkLoad`
  // into an index on several partitions, which the sending node splits by id. Served as
  // this node's own `BulkLoad` of the partition, for the caller it names, only if its map
  // gives it `partition`; each message reserves its share of the in-flight budget as a
  // client's does, on connections of their own, outside the `Cluster` calls' limit.
  // Cluster scope, gRPC only.
  rpc ForwardBulkLoad(stream ForwardBulkLoadRequest) returns (Empty);
  // D317 ticket 6: marks a partition open here fenced, a local flag persisted beside the map
  // (`fenced.json`). Its writes then answer `Fenced` (not committed: retry once it's
  // unfenced, or at its new node); its reads go on. Answers once every write admitted before
  // the flag has answered. `FailedPrecondition` for a partition this node doesn't hold.
  // Admin scope, or a node's cluster token (the map's writer running a move: D332, D331
  // PR 5).
  rpc Fence(PartitionRequest) returns (LocalPartition);
  // Clears the fence, after reopening the partition if it's closed. `FailedPrecondition`
  // unless this node's map names it as the partition's node at the epoch in its file.
  // Admin scope, or a node's cluster token (the map's writer undoing its own move's fence:
  // D332, D331 PR 5).
  rpc Unfence(PartitionRequest) returns (LocalPartition);
  // D317 amendment 2: closes a fenced partition, so its files are final. Its feed streams
  // and scans end with `PartitionUnavailable`, and so do its calls from then on. Answers
  // `CLOSED` at once; `files` fills in once they're hashed (`Status`). `FailedPrecondition`
  // unless it's fenced. Admin scope, or a node's cluster token (the map's writer running a
  // move: D332, D331 PR 5).
  rpc Close(PartitionRequest) returns (LocalPartition);
  // Moves a partition's files left on this node, after it moved away, into
  // `<cluster dir>/.phdb-dropped/` (nothing is deleted). `FailedPrecondition` while this
  // node's map names it as the partition's node, or while it's open. Admin scope, or a
  // node's cluster token (the map's writer running a move: D332, D331 PR 5).
  rpc DropPartition(PartitionRequest) returns (LocalPartition);
  // `phdb cluster relocate`'s first step, on the partition's new node: installs a complete
  // staged file set (`Admin.PartitionUpload`), if one is staged, then rewrites the file's
  // identity from `from_epoch` to `to_epoch`. A file already at `to_epoch` is a no-op, so a
  // rerun resumes. The reply's `files` is the set this call installed (none: empty).
  // `FailedPrecondition` while the partition is open here, or for a file of another
  // cluster, partition or epoch. Admin scope, or a node's cluster token.
  rpc Stamp(StampRequest) returns (LocalPartition);
  // Node to node (D326): a lease round's request for this node's grant of the partitions it
  // names, for `--cluster-lease-ms` on this node's clock from its receipt. This node grants
  // only at its own map version, only what that map gives the asking node at the epochs
  // asked, and withholds a partition while its grant of it to another node is live, or
  // everything during its start grace. A refusal isn't an error: the reply says what was
  // granted and why the rest wasn't. Cluster scope, gRPC only.
  rpc Lease(LeaseRequest) returns (LeaseResponse);
  // Node to node (D326): the asking node closed the partitions it names, so this node drops
  // them from its grant to it at once, rather than when the grant runs out: a planned
  // move's new node then needn't wait. Applied only to a grant of the same start of the
  // asking node, at a round no older than the grant's, so a delayed release can never end
  // a grant that's live. Cluster scope, gRPC only.
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
}

// One partition on the node a `Cluster` call is sent to (D317 ticket 6).
message PartitionRequest {
  string partition = 1;
  // `Unfence` only: lift the operator's fence without asking the peers whether their newest
  // map still names this node for the partition. It never makes the partition serve
  // without a lease (D326): that still takes a majority of the map's nodes granting it. For
  // a node whose peers can't answer its unfence, once they can grant again.
  bool force = 2;
}

// `Cluster.Stamp` (D317 ticket 6).
message StampRequest {
  // This cluster's id, which the file must record (or, with `restore_from_cluster_id`, which
  // it's rewritten to).
  string cluster_id = 1;
  string partition = 2;
  // The map's epoch for the partition, and that epoch + 1.
  uint64 from_epoch = 3;
  uint64 to_epoch = 4;
  // A restore (D317 ticket 8b): the file may be at any epoch up to `from_epoch`, since a
  // backup records the epoch it was taken at. Without it a file below `from_epoch` is
  // refused.
  bool restore = 5;
  // With `restore`: the cluster the file records, restored into this one as a new cluster.
  string restore_from_cluster_id = 6;
  // A promotion of this node's replica copy of the partition (D328, `phdb cluster promote`):
  // the file is a replica database at `replica_epoch` (the owner's epoch at its bootstrap),
  // not at `from_epoch`. The node makes it a primary at the last commit it applied, then
  // raises its epoch to `to_epoch`. Refused while the copy is open here. No staged set is
  // installed.
  bool promote = 7;
  // With `promote`: the epoch the CLI found in the copy's identity row, which the file must
  // still record, so the stamp acts on the copy that was checked.
  uint64 replica_epoch = 8;
  // D331 PR 5: a split's new partition, which has no file yet. The node creates it empty,
  // with its identity at `to_epoch` and marked split-created for `create_move`, before the
  // map change that adds it: create-new (a path that exists is never replaced), idempotent
  // for an empty file with that identity, refused for anything else under the id.
  bool create = 9;
  // With `create`: the split's move id, which the file's split-created mark names.
  string create_move = 10;
  // With `create`: the map version the split's COPYING change will carry. The node moves an
  // empty, marked, unmapped file aside only once it holds a map past this version that
  // doesn't place the partition. A rerun of the create refreshes the mark.
  uint64 create_version = 11;
}

// A partition's state on its node (D317 ticket 6).
enum LocalPartitionState {
  LOCAL_PARTITION_STATE_UNSPECIFIED = 0;
  // Open, reads and writes served.
  LOCAL_PARTITION_STATE_SERVING = 1;
  // Open, reads served, writes answer `Fenced`. Its files still change (flushes and
  // compactions).
  LOCAL_PARTITION_STATE_FENCED = 2;
  // Fenced and closed: its files are final, and its calls answer `PartitionUnavailable`.
  LOCAL_PARTITION_STATE_CLOSED = 3;
  // Being opened: its calls answer `PartitionUnavailable` until it's open.
  LOCAL_PARTITION_STATE_OPENING = 4;
}

// Why a partition is fenced (D317 ticket 6).
enum FenceReason {
  FENCE_REASON_UNSPECIFIED = 0;
  // `phdb cluster fence`, or a `close` (which makes any fence the operator's): kept in the
  // node's `fenced.json` across a restart, lifted by `phdb cluster unfence`, or by a stamp
  // that installs another copy of the partition (a move or relocation onto that node).
  FENCE_REASON_OPERATOR = 1;
  // The node hasn't held the partition's lease since it opened here (D326): a majority of
  // the map's nodes have yet to grant it, so it serves neither reads nor writes.
  FENCE_REASON_AWAITING_PEER_MAP = 2;
  // The partition's lease ran out on this node (D326): its renewals stopped reaching a
  // majority of the map's nodes, so it stopped serving until a renewal does.
  FENCE_REASON_LEASE_LAPSED = 3;
  // A range of the partition is being handed over to another partition (D331): writes
  // touching it answer `Fenced` until the move's map gives it to the target, then
  // `WrongPartition`. The partition's other keys take writes; this is reported only in
  // `MoveStatus.fenced`, never as the partition's `fence_reason`. Retry-safe.
  FENCE_REASON_RANGE_MOVING = 4;
}

// The partition map (D317 §1): one versioned document, the same in gRPC, HTTP/JSON and the
// map file (`<cluster dir>/cluster-map.json`, canonical proto3 JSON).
message ClusterMap {
  // Fixed for a cluster's life: a node refuses a map of another cluster, and each partition
  // file records it (`__phdb_cluster`).
  string cluster_id = 1;
  // Raised by every change; a node refuses a map no newer than its own.
  uint64 map_version = 2;
  repeated Node nodes = 3;
  // Which node serves each partition (layer 2: changes by relocation, with a higher epoch).
  repeated Partition partitions = 4;
  // Which partition holds each key range (layer 1: fixed once written).
  repeated TablePlacement tables = 5;
  // The nodes of the map before this one, when this one changed them (D317 rule 3, #1899's
  // F4): the map's writer takes no other change until a majority of these and a majority of
  // `nodes` hold the map. Derived where the map is set (a forced map clears it), carried by
  // the changes after it, and cleared by the first one once both majorities hold it.
  repeated Node previous_nodes = 6;
  // The vector and text indexes' placements (#1722, ICR 0138): each partition named holds a
  // whole index of the ids in its range.
  repeated IndexPlacement indexes = 7;
  // The agent memory store's placement (#1915, ICR 0139), if the cluster serves one: each
  // partition named holds a whole store for the namespaces in its range.
  MemoryPlacement memory = 8;
  // D330: the map's writer, the one node that changes it, and the term it was elected at.
  // Maps are ordered by `(writer_term, map_version)`: a node takes a map with a higher term
  // whatever its version, and refuses one with a lower term. Term 0 (no node named): the
  // writer is the node with the smallest id, as before D330, until the first election
  // writes term 1. Set only once every node keeps them (`map_features`: `writer_terms`).
  string writer = 9;
  uint64 writer_term = 10;
  // D330: automatic failover, off by default (the owner's Q1), turned on with `set-map`.
  // Off: no node elects a new writer on its own; the writer changes only as before D330
  // (an operator's `set-map --force`, which raises the term). Set only once every node
  // keeps it (`map_features`: `writer_terms`). On: a writer whose lease lapses is replaced
  // by election, and the writer fails a down partition over to its freshest replica (PR 2),
  // unless the partition opts out (`Partition.failover`).
  bool failover = 11;
  // D330: reserved for an old owner rejoining as a replica on its own (the owner's Q4); a
  // map setting it is refused in 1.3.0, where the operator rejoins it.
  bool failover_rejoin = 12;
  // D330: the failovers and writer elections this map records, oldest first: the last 16
  // done or abandoned, and every promote still pending (one whose `to_epoch` is above its
  // partition's epoch), which is never dropped. A writer's change keeps them; a `set-map`
  // that drops or alters a pending one is refused.
  repeated FailoverEvent failovers = 13;
  // D331: the range moves in flight, each a table's key range going from one partition to
  // another through `MovePhase`s. The map's writer advances them; every node derives its
  // partitions' range gates from them. A partition is in at most one at a time, as source
  // or target. Set only once every node keeps them (`map_features`: `range_moves`).
  repeated RangeMove moves = 14;
  // D332: the balancer, run by the map's writer (off by default). PAUSED finishes the action
  // in flight and starts no other. Set only once every node keeps it (`balancer`).
  BalancerMode balancer = 15;
  // D332: the balancer's bounds; a 0 field is its default.
  BalanceBounds balance = 16;
  // D332: the balancer's last 32 actions, and each change of its reason for none.
  repeated BalancerEvent balancer_events = 17;
}

// D332: whether the map's writer runs the balancer.
enum BalancerMode {
  BALANCER_MODE_UNSPECIFIED = 0;
  BALANCER_MODE_OFF = 1;
  BALANCER_MODE_ON = 2;
  BALANCER_MODE_PAUSED = 3;
}

// D332: the balancer's bounds. A field at 0 takes the default given.
message BalanceBounds {
  // The largest node's size per unit of weight over the mean (1.25).
  double size_ratio = 1;
  // The same for load (1.25).
  double load_ratio = 2;
  // A partition past it is split (32 GiB).
  uint64 partition_max_bytes = 3;
  // A partition past this share of a node's capacity is split (0.5).
  double partition_max_load = 4;
  // A partition under it, and under a tenth of its node's mean load, is merged
  // (partition_max_bytes / 8).
  uint64 partition_min_bytes = 5;
  // Consecutive 30 s passes a condition holds before the balancer acts on it (10).
  uint32 passes = 6;
  // How long what an action touched rests after it, in ms (30 min).
  uint64 dwell_ms = 7;
  // Moves within `bounce_window_ms` that auto-pin a partition (3).
  uint32 max_moves = 8;
  // The window for `max_moves`, and how long an auto-pin lasts, in ms (24 h).
  uint64 bounce_window_ms = 9;
}

// D332: what a balancer event records.
enum BalancerEventKind {
  BALANCER_EVENT_KIND_UNSPECIFIED = 0;
  BALANCER_EVENT_KIND_MOVE = 1;
  BALANCER_EVENT_KIND_SPLIT = 2;
  BALANCER_EVENT_KIND_MERGE = 3;
  BALANCER_EVENT_KIND_PIN = 4;
  // No action, and why: written only when the reason changes.
  BALANCER_EVENT_KIND_SKIP = 5;
  // A new writer ended an earlier writer's action before its commit point.
  BALANCER_EVENT_KIND_ABORT = 6;
}

// D332: one balancer action, or a change of its reason for none.
message BalancerEvent {
  BalancerEventKind kind = 1;
  string partition = 2;
  // A move's source node; a merge's source partition.
  string from = 3;
  // A move's target node; a split's new partition's node; a merge's target partition.
  string to = 4;
  // A split's key.
  SplitKey split_key = 5;
  string reason = 6;
  uint64 at_ms = 7;
  // The `moves` record the action started, if any.
  string move_id = 8;
  // A split's table.
  string table = 9;
}

// D332: one entry of a partition's balancer history (`Partition.moves_history`).
message MoveHistory {
  BalancerEventKind kind = 1;
  uint64 at_ms = 2;
}

// A half-open key range of a table, `[start, end)` in split keys: D332's
// `TablePlacement.pinned_ranges`, and any other split-key range.
message SplitRange {
  // Absent: the table's first key.
  SplitKey start = 1;
  // Absent: to the table's end.
  SplitKey end = 2;
}

// D331: one range move, `[start, end)` of `table` from partition `from` to partition `to`.
message RangeMove {
  // The move's id: 1-64 of `[a-z0-9_-]`, unique among `moves`.
  string id = 1;
  MoveKind kind = 2;
  string table = 3;
  // The range's first key; absent: the table's first key.
  SplitKey start = 4;
  // The key after the range; absent: to the table's end.
  SplitKey end = 5;
  // The source partition, S.
  string from = 6;
  // The target partition, T (for a split, the partition the split added).
  string to = 7;
  MovePhase phase = 8;
  // S's seqno the copy was taken at, once T reported the copy done; 0 before.
  uint64 snapshot_seqno = 9;
  // S's visible seqno once its range fence drained (from HANDING_OVER): every write to the
  // range S took is at or below it. 0 until S reports it.
  uint64 final_seqno = 10;
  // The `(writer_term, map_version)` of the map that gave the range to T, set in that map
  // itself (from HANDED_OVER): a node holding it, or any map ordered after it, is past the
  // move's commit point.
  uint64 handed_over_version = 11;
  uint64 handed_over_term = 12;
  // The source partition's epoch when the move entered COPYING (D332 PR 2, #1485). A NODE
  // move's HANDED_OVER map is refused if the partition's epoch changed since (a failover
  // promoted it mid-move). 0 on a record from before this field.
  uint64 from_epoch = 13;
  // D331 PR 5: the target partition's epoch when the move entered COPYING. The move aborts
  // if it changes before the commit point (a failover of the target). 0: unknown, not
  // compared.
  uint64 to_epoch = 14;
  // D331 PR 5 / D332: the move is a split. Its target is a partition the split created
  // (phdb cluster split, or a balancer split), which an abort removes with the record.
  // Set by the change that first records the move; never inferred from the id or the
  // target's shape.
  bool split = 15;
}

// D331: what a range move is for.
enum MoveKind {
  MOVE_KIND_UNSPECIFIED = 0;
  // `phdb cluster move-range`: to an existing partition.
  MOVE_KIND_RANGE = 1;
  // `phdb cluster split`: to a partition the split added.
  MOVE_KIND_PARTITION = 2;
  // D332: a whole partition relocated to another node (no table or range; `to` names the
  // node; `from_epoch` its epoch at COPYING). D332 PR 2: `phdb cluster move` records one.
  MOVE_KIND_NODE = 3;
  // PR 6 (merge) adds MOVE_KIND_MERGE = 4.
}

// D331: where a range move is. A move goes forward one phase per map; before HANDED_OVER it
// may be removed (an abort), and from CLEANING it is removed once S's copy is gone.
enum MovePhase {
  MOVE_PHASE_UNSPECIFIED = 0;
  // T copies the range from S's snapshots. S serves it; T answers it `PartitionUnavailable`.
  MOVE_PHASE_COPYING = 1;
  // T follows S's feed for the range.
  MOVE_PHASE_CATCHING_UP = 2;
  // S fences the range's writes (`Fenced`, RANGE_MOVING) and drains them; reads go on.
  MOVE_PHASE_HANDING_OVER = 3;
  // The commit point: the map gives the range to T and raises S's epoch. S answers the
  // range `WrongPartition`; T still answers it `PartitionUnavailable` until CLEANING.
  MOVE_PHASE_HANDED_OVER = 4;
  // T serves the range (S has taken the HANDED_OVER map, or its old lease has provably
  // ended); S deletes its copy.
  MOVE_PHASE_CLEANING = 5;
  // PR 6 adds MOVE_PHASE_AWAITING_OUTCOMES = 6, after CLEANING and for MERGE moves only:
  // the merged-away source waits for its transaction outcomes before it's dropped. The
  // phases stay in order, so "from HANDED_OVER on" includes it.
  // D331 PR 5: an abort under way, from COPYING, CATCHING_UP or HANDING_OVER: before the
  // commit point and inactive. S serves the range as if no move named it (no fence), T
  // serves none of it and drops what it copied, and a split's new partition goes once its
  // node reports it empty; then the record goes. It is OUT OF the phases' order: every
  // comparison of phases excludes it explicitly (`map::past_commit`, `map::active`), never
  // by number.
  MOVE_PHASE_ABORTING = 7;
}

// D331: a range move as a node holding one of its partitions sees it (`LocalPartition.moves`).
message MoveStatus {
  string id = 1;
  string table = 2;
  MovePhase phase = 3;
  // This partition is the move's source (else its target).
  bool source = 4;
  // The source fences the range's writes.
  bool fenced = 5;
  // The partition serves the range here.
  bool serving = 6;
  // D331 PR 4b, on the target: the bytes copied so far, whether the copy is done, and the
  // source's seqno its catch-up has passed (PR 5 checks it against `final_seqno`).
  uint64 copied_bytes = 7;
  bool copy_done = 8;
  uint64 source_applied_seqno = 9;
  // On the source: the move's feed retention hold lapsed (past `--move-retention-cap`, or
  // lost to a restart of the source); the move can't catch up and must be aborted.
  bool retention_lapsed = 10;
  // On the target: why its range follower stopped for good (the source's history expired,
  // a range drop of the range, a row left partly copied, the source failed over); empty
  // while it runs or once it's done. PR 5's driver aborts the move on it.
  string follower_error = 11;
  // D331 PR 5, on the source: its visible seqno once the range's fence drained and no share
  // was in doubt (from HANDING_OVER); 0 until then. The driver records it as `final_seqno`.
  uint64 fence_seqno = 12;
  // D331 PR 5, on the source (CLEANING) or a split's new partition (ABORTING): the range's
  // drop finished.
  bool dropped = 13;
  // D331 PR 5, on the target: what its follower waits for before copying (an earlier move's
  // drop of an overlapping range here); empty when it waits for nothing. For people and the
  // driver's timeout, never an error.
  string follower_waiting = 14;
}

// D330: one failover of a partition to a replica, or one writer election, as the writer
// that made it recorded it in the map.
message FailoverEvent {
  FailoverKind kind = 1;
  // PARTITION: the partition failed over; empty for WRITER.
  string partition = 2;
  // PARTITION: its owner before, and the replica's node it's promoted on. WRITER: the
  // writer before, and the node elected.
  string from = 3;
  string to = 4;
  // The writer's wall clock when it recorded the event, in ms since the Unix epoch: for
  // operators, never compared.
  uint64 at_ms = 5;
  // The writer that recorded it, and its term then.
  string writer = 6;
  uint64 writer_term = 7;
  // PARTITION: the primary seqno the promoted copy had applied through, and the owner's
  // durable seqno as the copy last heard it. Their difference is the known part of what
  // the failover lost; commits the owner acknowledged after the copy last heard from it
  // may be lost too (D330 §4). `primary_seqno` 0: unknown (the copy's follower hadn't heard
  // the owner's frontier since it last reconnected).
  uint64 applied_seqno = 8;
  uint64 primary_seqno = 9;
  // PARTITION: the external transaction shares the old owner reported in doubt, as of its
  // last lease renewal before it went down (at most 4 KiB of ids), and how many there were.
  repeated string in_doubt_xids = 10;
  uint64 in_doubt_count = 11;
  // PARTITION: the epoch the promote stamps the copy at, above every earlier pending
  // promote's of the partition, so a copy stamped by a promote that never finished is never
  // taken for this history (simp724's S2 on the D330 PR 2 plan).
  uint64 to_epoch = 12;
  FailoverState state = 13;
}

enum FailoverKind {
  FAILOVER_KIND_UNSPECIFIED = 0;
  FAILOVER_KIND_PARTITION = 1;
  FAILOVER_KIND_WRITER = 2;
}

enum FailoverState {
  FAILOVER_STATE_UNSPECIFIED = 0;
  // Recorded before the stamp: the map doesn't give the partition its new node yet.
  FAILOVER_STATE_PENDING = 1;
  // The map gives it its new node at `to_epoch` (every WRITER event is done).
  FAILOVER_STATE_DONE = 2;
  // A later promote of the partition took over: a copy stamped at this event's
  // `to_epoch` is orphaned, never served.
  FAILOVER_STATE_ABANDONED = 3;
}

message Node {
  string id = 1;
  // The node's listener, `host:port` (TLS unless the cluster runs without it).
  string address = 2;
  // D332: the node's capacity relative to the others, for the balancer (0 counts as 1).
  uint32 weight = 3;
}

message Partition {
  string id = 1;
  // The node serving it: a `Node.id`.
  string node = 2;
  // Raised by every relocation; a node writes P only while the map's epoch for P equals
  // the epoch in P's file (D317 §2).
  uint64 epoch = 3;
  // The engine memory P takes on its node (D317 ticket 8a): its memtables, block cache and
  // row cache, taken off the top of the node's `--engine-memory` before the rest is split
  // equally across the node's other partitions. 0: an equal share.
  uint64 memory_bytes = 4;
  // The epoch P's current history began at (D317 ticket 6): kept by a relocation that copied
  // P's files (`SetMapRequest.copies`), and set to the new epoch by every other one (a
  // promotion, a restore), which gives P another history. A feed token taken at epoch `e`
  // resumes only while `history_epoch <= e`. Derived where a map is set; 0 in maps from
  // before ticket 6, when no epoch had moved.
  uint64 history_epoch = 5;
  // The nodes holding a read replica of P (D328, #1851), in order of preference: each a
  // `Node.id`, none P's `node`, none twice. A replica copy follows P's owner's change feed
  // (which must be on) and serves reads that allow a bounded staleness; it never takes a
  // write or P's lease. A change to this alone is no move: P's epoch stays. (6 is unused.)
  repeated string replicas = 7;
  // D330: whether the writer fails P over on its own while the map's `failover` is on.
  // The map's flag is the master switch: OFF opts P out, and ON is INHERIT's behaviour.
  FailoverMode failover = 8;
  // D330: how many times P has failed over, ever: monotonic, unlike the map's last-16
  // events (`pigeonhole_cluster_failovers_total`).
  uint64 failover_count = 11;
  // D332: the balancer leaves P on its node. Set by an operator (`phdb cluster balancer
  // pin`), or by the balancer for a partition that bounced, with a PIN entry in
  // `moves_history`; the balancer's own pin expires after the bounce window.
  bool pinned = 9;
  // D332: the balancer's last 8 actions on P (moves, splits, merges, its pins).
  repeated MoveHistory moves_history = 10;
}

enum FailoverMode {
  FAILOVER_MODE_UNSPECIFIED = 0;
  FAILOVER_MODE_INHERIT = 1;
  FAILOVER_MODE_OFF = 2;
  FAILOVER_MODE_ON = 3;
}

message TablePlacement {
  string name = 1;
  // A co-location group (optional): its tables are unsplit and on one partition.
  string group = 2;
  // The table's schema (D317 §5; reconciled onto the partitions from ticket 5).
  repeated FamilySpec families = 3;
  // Sorted, distinct split keys; none: the whole table is one range.
  repeated SplitKey splits = 4;
  // `splits.len() + 1` partition ids: range i is `[splits[i-1], splits[i])`, the first
  // starting at the empty key and the last open-ended.
  repeated string partitions = 5;
  // The map version that created the table through `Schema.CreateTable` (D317 ticket 5), or
  // 0 for a placement set by hand. Fixed for the table's life: a table dropped and created
  // again under its name gets a new one, which tells a node that missed both to drop the
  // old table and create the new.
  uint64 created = 6;
  // D332: ranges the balancer never splits inside or moves (an operator's pins).
  repeated SplitRange pinned_ranges = 7;
}

// Where an agent memory store's namespaces are (#1915, ICR 0139). A store keeps its data in
// three tables (`mem_{store}`, `mem_{store}_text`, `mem_{store}_ivf`), whose index rows cover
// every namespace in a file, so a partition holds a whole store of its own for the
// namespaces in its range, made with the node's `--memory-*` options. Fixed once written.
message MemoryPlacement {
  // The store's name, as `phdb serve --memory` names it.
  string store = 1;
  // Sorted, distinct namespaces, none containing `\0` (so no namespace's rows straddle
  // one); none: one range. Namespace `ns` is in range i when `splits[i-1] <= ns < splits[i]`.
  repeated SplitKey splits = 2;
  // `splits.len() + 1` partition ids, one per range, as `TablePlacement.partitions`.
  repeated string partitions = 3;
}

// Where an index's ids are (#1722, ICR 0138). An index keeps its rows in one table whose keys
// aren't its ids (centroids and lists, or postings and counters), so each partition named
// holds a whole index of its own over the ids in its range, made with the options the
// create sent. Fixed once written; dropped with `Schema.DropTable` of its name.
message IndexPlacement {
  // The index (and its table's) name: unique among the map's tables, indexes and memory
  // store tables.
  string name = 1;
  // The create request, as the client sent it: what each partition creates its index with.
  oneof kind {
    CreateVectorIndexRequest vector = 2;
    CreateTextIndexRequest text = 3;
  }
  // A placed table whose ranges and partitions it shares: an id is that table's row key. A
  // text index always follows its source table (`Text.Put` writes the source row and the
  // postings in one transaction).
  string follows = 4;
  // Or its own ranges over its ids (a vector index only; empty with `follows`), as
  // `TablePlacement.splits` and `partitions`.
  repeated SplitKey splits = 5;
  repeated string partitions = 6;
  // The map version that created it, as `TablePlacement.created`.
  uint64 created = 7;
}

// A split key, in the map only: `text` for a UTF-8 key an operator writes by hand, `raw`
// for any bytes. Both forms of one key are the same key.
message SplitKey {
  oneof key {
    string text = 1;
    bytes raw = 2;
  }
}

message GetMapRequest {}

message SetMapRequest {
  // The map version the caller replaces: 0 for a node's first map.
  uint64 expected_map_version = 1;
  ClusterMap map = 2;
  // The forced recovery for a map writer that's down (D317 amendment 1): set the map at
  // this node, which needn't be the writer, without the compare-and-set. The map must be
  // the cluster's, at a version above this node's. `phdb cluster set-map --force` sets it at
  // a version above every reachable node's, naming a live writer.
  bool force = 3;
  // The partitions this change relocates by copying their files (D317 ticket 6, `phdb
  // cluster relocate --copy`): each keeps its `history_epoch`. Each must move to another
  // node at exactly its epoch + 1. Not part of the map: it marks this change only.
  repeated string copies = 4;
}

message SetMapResponse {
  uint64 map_version = 1;
  repeated NodePush pushed = 2;
}

// What pushing the map to one node did.
message NodePush {
  string node = 1;
  bool ok = 2;
  // Why not, when `ok` is false: the node pulls the map once it's reachable again.
  string error = 3;
}

message PushMapRequest {
  ClusterMap map = 1;
}

message PushMapResponse {
  // The receiver's map version after the push.
  uint64 map_version = 1;
}

message StatusRequest {
  // D332: only the partitions open here, with their file bytes from the file system: the
  // balancer's survey, which skips reading every closed file's identity. Older nodes ignore
  // it and answer in full.
  bool open_only = 1;
}

message NodeStatus {
  string node_id = 1;
  // 0 before the node has a map.
  uint64 map_version = 2;
  string cluster_id = 3;
  repeated LocalPartition partitions = 4;
  // Peers seen with this node's `map_version` but a different map: the cluster has two maps
  // of one version, and an operator must set a newer one.
  repeated string divergent = 5;
  // D326: the time left on this node's start grace, in which it grants no lease, its own
  // included (it may have granted one just before it stopped, and grants live only in
  // memory). 0 once it's over.
  uint64 grace_remaining_ms = 6;
  // What this node's build supports that its peers rely on (ICR 0138, 0139):
  // - the map fields it keeps: `indexes`, `memory`. A map's writer adds such a field only
  //   once every node reports it, since a node that drops a field from its copy reads as
  //   holding a different map (divergent);
  // - request fields it applies: `nearest_qualifiers` (`NearestRequest.qualifiers`). A node
  //   refuses a request that needs one while a node holding a part of it doesn't report it.
  // Empty from older nodes.
  repeated string map_features = 7;
  // D330: the map's writer as this node's map names it (the smallest id at term 0), and
  // the highest writer term this node knows: its map's, or one it voted for. A map below it
  // is refused here, so `phdb cluster set-map --force` sets a term above every node's.
  string writer = 8;
  uint64 writer_term = 9;
  // On the writer: the time left on its writer lease, as its last lease round gave it. On
  // another node: the time left on this node's grant of the writer lease to the writer. 0
  // once it has run out (or this node never granted it).
  uint64 writer_lease_remaining_ms = 10;
  // D330, on the writer: each partition it finds down but doesn't fail over, and why
  // ("failover off", "no fresh replica", "waiting: node X still grants its lease", ...).
  map<string, string> failover_blocked = 12;
  // D330: every partition lease this node grants that still runs: the partition, its
  // holder, and the time left on this node's clock (not the writer lease). The writer asks
  // before it fails a partition over: an owner some node still grants is alive.
  repeated LeaseWithheld grants = 13;
  // D332: the balancer's state on the map's writer: its last decision, or why it takes
  // none, and how many passes the next action has waited. For people to read, not a format
  // to parse. Empty on any other node, or with the balancer off.
  string balancer = 14;
  // D331 PR 5: this node's range-move limits, as a move's plan reads them for a source on
  // it: `--move-rate-bytes`, `--move-retention-cap` and `--max-move-followers`. 0: unknown
  // (an older node).
  uint64 move_rate_bytes = 15;
  uint64 move_retention_cap = 16;
  uint32 max_move_followers = 17;
}

// A partition file in the node's directory, as its identity row says.
message LocalPartition {
  string id = 1;
  uint64 epoch = 2;
  // Relative to the node's cluster directory.
  string file = 3;
  // False when the file couldn't be read, or its row doesn't match the map: `error` says why.
  bool ok = 4;
  string error = 5;
  // The partition's schema reconcile (D317 ticket 5), on the node serving it: the map version
  // it last reconciled to, what failed, the tables in the file the map doesn't place (made
  // by hand: left alone), and the tables a create through the map took over from a hand-made
  // one of the same name.
  uint64 reconciled_version = 6;
  repeated string reconcile_errors = 7;
  repeated string unmapped_tables = 8;
  repeated string adopted_tables = 9;
  // D317 ticket 6: its state here, for a partition this node holds.
  LocalPartitionState state = 10;
  // A closed partition's files once hashed: each one's name (its suffix after the
  // partition's path), size and SHA-256. Empty while they're being hashed; a failed hash
  // sets `error`, and `Close` again retries it. `Stamp`'s reply: the set it installed.
  repeated PartitionFile files = 11;
  // Why it's fenced: set only when `state` is FENCED. The operator's fence when it's set,
  // else AWAITING_PEER_MAP.
  FenceReason fence_reason = 12;
  // It holds no live lease here (D326): a majority of the map's nodes have yet to grant it
  // since it opened, or its lease lapsed. Whatever `fence_reason` says: an operator-fenced
  // partition may be waiting for its lease too (#1829, ICR 0117 amendment).
  bool awaiting_peers = 13;
  // D326: the time left on the partition's lease here, in milliseconds; 0 when it holds none
  // (`awaiting_peers` is then true). A partition serves only while it holds one.
  uint64 lease_remaining_ms = 14;
  // D328: whether this node holds P as its owner or as one of `Partition.replicas`.
  PartitionRole role = 15;
  // For a replica copy (D328): the node it follows, P's owner in this node's map.
  string replica_of = 16;
  // For a replica copy: the owner's seqno of P it applied through.
  uint64 replica_applied_seqno = 17;
  // For a replica copy: the owner's durable frontier of P, as its last message said.
  uint64 replica_primary_seqno = 18;
  // For a replica copy: milliseconds since it last heard it was caught up, on its own
  // clock (the owner sends a caught-up message at least once a second while idle). It
  // grows from the moment the owner's stream stops.
  uint64 replica_lag_ms = 19;
  // For a replica copy: where its follower is.
  ReplicaState replica_state = 20;
  // D329: shares of transactions across partitions held here in doubt (prepared, their
  // decision not yet known here), the oldest's xid and age, and the WAL bytes they keep.
  uint32 in_doubt = 21;
  string in_doubt_oldest_xid = 22;
  uint64 in_doubt_oldest_age_ms = 23;
  uint64 in_doubt_wal_bytes = 24;
  // Each, with why it's still in doubt (its home unreachable, or its home's history changed).
  repeated InDoubtShare in_doubt_shares = 25;
  // D331: the range moves naming this partition, as source or target.
  repeated MoveStatus moves = 27;
  // D331: for a move's target, its range follower's lag behind the source, in milliseconds
  // (0 when it has none).
  uint64 move_follower_lag_ms = 28;
  // D332: the partition's load on this node, for the cluster balancer, each an exponential
  // average over `--balance-window` (each 30 s reading weighing `1 − e^(−30/window)`). 0 for a
  // replica copy, and until the first interval ends.
  // - `load_cpu`: its share of the node's cores, `(max(B, sync_busy) + sampled request CPU) ÷
  //   cores`, B and sync_busy being its database's shard busy and group-sync fractions. The
  //   sampled CPU includes its reads' work on the server's read pools. CPU outside the
  //   partition's service calls (request decoding and encoding, framing, sockets) isn't
  //   counted: compare partitions, not absolutes.
  // - `load_device`: its device bytes per second (the engine's estimate at its files: reads
  //   the OS page cache served count too) over this node's ceiling, the highest one-second
  //   rate of the same counters summed over the node's partitions within the window.
  // - `load`: the larger of the two.
  double load_cpu = 29;
  double load_device = 30;
  double load = 31;
  // D332: the partition file's size here, from the file system (the database is one file,
  // WAL included), for the balancer. Open partitions only; 0 when closed.
  uint64 file_bytes = 32;
}

// A share held in doubt (D329).
message InDoubtShare {
  string xid = 1;
  uint64 age_ms = 2;
  string reason = 3;
}

// D328: how a node holds a partition.
enum PartitionRole {
  PARTITION_ROLE_UNSPECIFIED = 0;
  // The map's `Partition.node`: it takes writes and holds P's lease.
  PARTITION_ROLE_OWNER = 1;
  // One of `Partition.replicas`: a read-only copy following the owner.
  PARTITION_ROLE_REPLICA = 2;
}

// D328: a replica copy's follower.
enum ReplicaState {
  REPLICA_STATE_UNSPECIFIED = 0;
  // Downloading and installing a copy of P from its owner (the first, or again after its
  // position expired: the old copy serves meanwhile).
  REPLICA_STATE_BOOTSTRAPPING = 1;
  // Following the owner's feed.
  REPLICA_STATE_FOLLOWING = 2;
  // Not following, after an error (`LocalPartition.error` says which): it retries.
  REPLICA_STATE_BEHIND = 3;
  // Not following: the copy is closing, or the node is stopping.
  REPLICA_STATE_STOPPED = 4;
  // The owner's change feed for P is off, so there is nothing to follow: start the owner's
  // node with `--change-feed`. It asks again every 30 s.
  REPLICA_STATE_OWNER_FEED_OFF = 5;
}

// A forwarded single-key call (D317 ticket 2).
message ForwardRequest {
  // The sending node's map version. Only older isn't a reason to refuse (D132).
  uint64 map_version = 1;
  // Who the call is for, checked again here.
  ForwardedCaller caller = 2;
  // One partition's part of a read another node fans out (D317 #1715): a multi-get's keys
  // (a 4a multi-get's, or a traversal hop's) or a nearest search's. The sending node holds
  // the in-flight budget for its page, so this node serves it with no budget of its own: no
  // admission and no reply charge, its scope still checked. Only a peer sends it:
  // `Cluster.Forward` takes cluster scope. Set on another call, it's ignored.
  bool fanout_part = 21;
  // A read the entry node chose this node's replica copy of the partition for (D328): it's
  // served from the copy, not as the partition's owner, if the copy's freshness is within
  // `replica_max_lag_ms`, else `ReplicaBehind`, and the entry node tries the next replica or
  // the owner. Only a single-partition read without a snapshot or transaction is sent so.
  bool to_replica = 44;
  // The client's bound (`x-pigeonhole-read-replica-max-lag-ms`), checked on this node's
  // clock: now less the copy's freshness. With `to_replica` only.
  uint64 replica_max_lag_ms = 42;
  // The client's read-your-writes seqno for the partition (`x-pigeonhole-min-primary-seqno`):
  // the copy waits, within the call's deadline, until it has applied the owner's commits
  // through it. 0: none. With `to_replica` only.
  uint64 min_primary_seqno = 43;
  // The partition a fanned-out part of an index search or check is for (#1722, ICR 0138):
  // its request names only the index, and a node can own several of the index's
  // partitions. This node serves that partition if it owns it and the index is placed on
  // it, else `WrongPartition`. Empty on every other call.
  string partition = 50;
  oneof op {
    GetRequest get = 3;
    ReadRowRequest read_row = 4;
    MutateRequest mutate = 5;
    CheckAndMutateRequest check_and_mutate = 6;
    MutateRequest mutate_returning = 7;
    // Every row in one partition: a batch across partitions is refused before it's sent.
    BatchRequest batch = 8;
    // One partition's keys of a multi-get the sending node fans out (D317 ticket 4).
    MultiGetRequest multi_get = 9;
    // A transaction's or a snapshot's calls (D317 ticket 3), on the node serving the
    // partition it's bound to. Its id names that partition (`<partition>:<id>`). 9 is
    // ticket 4's `multi_get`.
    BeginRequest begin = 10;
    TxnGetRequest txn_get = 11;
    TxnGetRowRequest txn_get_row = 12;
    TxnWriteRequest txn_write = 13;
    TxnCommitRequest commit = 14;
    TxnAbortRequest abort = 15;
    OpenSnapshotRequest open_snapshot = 16;
    ReleaseSnapshotRequest release_snapshot = 17;
    // One partition's part of a `Nearest` the sending node fans out (D317 ticket 4b): its
    // keys, or the range clipped to the partition. After D317 ticket 3's arms.
    NearestRequest nearest = 18;
    // A schema change, sent to the map's writer: the node with the smallest id in the map,
    // which alone changes the map for schema calls, so two entry nodes' changes can't
    // diverge (D317 ticket 5). Another node answers `WrongPartition`.
    CreateTableRequest create_table = 19;
    DropTableRequest drop_table = 20;
    // Index calls (#1722, ICR 0138): a create to the map's writer, as a table's; a write to
    // the partition holding its id.
    CreateVectorIndexRequest create_vector_index = 22;
    VectorInsertRequest vector_insert = 23;
    VectorDeleteRequest vector_delete = 24;
    // One partition's part of a search or check across an index's partitions (#1722 PR 1b):
    // the client's request as it is, on the partition `partition` names.
    VectorSearchRequest vector_search = 25;
    VectorVerifyRequest vector_verify = 26;
    CreateTextIndexRequest create_text_index = 27;
    TextPutRequest text_put = 28;
    TextDeleteRequest text_delete = 29;
    // One partition's part of a rebuild across an index's partitions (#1722 PR 2c): the
    // client's request as it is, on the partition `partition` names. A write, served as
    // the partition's own `Text.Rebuild`.
    TextIndexRequest text_rebuild = 30;
    // As `vector_verify`.
    TextIndexRequest text_verify = 31;
    // The two rounds of a text search across an index's partitions (#1722 PR 2b): each
    // partition's statistics for the query, then its part of the search scored with the
    // partitions' merged statistics.
    TextStatsRequest text_stats = 32;
    TextSearchPartRequest text_search = 33;
    // Agent memory calls (#1915, ICR 0139), each the client's request, to the partition
    // that holds its namespace (21–33 are ICR 0138's index calls). A call whose namespaces
    // or ids are in several partitions never comes here whole.
    RememberRequest remember = 34;
    RecallRequest recall = 35;
    MarkUsedRequest mark_used = 36;
    SupersedeRequest supersede = 37;
    LinkRequest link = 38;
    ForgetRequest forget = 39;
    // A recall's steps on one partition, when its namespaces are on several (#1915, ICR
    // 0139): the pool, or a hop of its graph expansion, and the hits' bodies.
    RecallPoolRequest recall_pool = 40;
    RecallBodiesRequest recall_bodies = 41;
    // D329 (ICR 0140): a spanning transaction's home node, the coordinator, to a branch's
    // partition owner (`partition` names it). `branch_begin` carries the client as `caller`;
    // `branch_prepare` and `branch_decide` are the node's own, cluster scope only.
    BranchBegin branch_begin = 45;
    BranchPrepare branch_prepare = 46;
    BranchDecide branch_decide = 47;
    // A branch's node asks its transaction's home what was decided, for a share it holds in
    // doubt (D329's resolver): the node's own call, cluster scope only.
    ResolveTxn resolve_txn = 48;
    // A client's `Transactions.Outcome` for a transaction whose home this node isn't
    // (D329): the client's caller rides `caller`, write scope.
    TxnOutcomeRequest txn_outcome = 52;
    // D331 PR 4b: one chunk of a range move's copy, from the move's target to its source.
    RangeCopyRequest range_copy = 49;
  }
}

// Round 1 of a text search across an index's partitions (#1722 PR 2b, ICR 0138): this
// partition's statistics for the query, read at one snapshot. Every partition of the index
// is asked, whatever `id_prefix` says: a search's statistics cover the whole index.
message TextStatsRequest {
  // The client's search, as it is.
  TextSearchRequest search = 1;
}

message TextStatsResponse {
  // `pigeonhole_text::QueryStats`'s versioned bytes. A version the sending node doesn't
  // read fails the search with `FailedPrecondition`: the nodes' builds differ.
  bytes stats = 1;
}

// Round 2 of a text search across an index's partitions (#1722 PR 2b, ICR 0138): this
// partition's top `k`, scored with every partition's statistics merged.
message TextSearchPartRequest {
  // The client's search, as it is.
  TextSearchRequest search = 1;
  // The merged `QueryStats`' versioned bytes. Empty for an index on one partition, whose
  // own statistics are the whole index's: that part reads them itself, in one round.
  bytes stats = 2;
}

// One partition's step of a recall whose namespaces are on several partitions (#1915,
// ICR 0139): its pool of candidates, or with `hop` its part of one hop of the graph
// expansion. The sending node merges the partitions' answers and ranks them as one store
// would.
message RecallPoolRequest {
  // The client's recall, its namespaces narrowed to this partition's, and its embedding the
  // one the sending node made from its text (the query is embedded once).
  RecallRequest request = 1;
  // The recall's one clock, in µs since the Unix epoch, so recency compares across
  // partitions.
  uint64 now_us = 2;
  // A hop of the graph expansion (`pigeonhole_memory::RecallHop`'s versioned bytes); empty
  // for the pool. A version this node doesn't read is `FailedPrecondition`.
  bytes hop = 3;
}

message RecallPoolResponse {
  // The pool (`RecallPool`'s versioned bytes), or with `hop` the hop's part
  // (`RecallHopPart`'s).
  bytes pool = 1;
}

// The bodies of a recall's best hits on one partition (#1915, ICR 0139).
message RecallBodiesRequest {
  // The client's recall, its namespaces narrowed to this partition's.
  RecallRequest request = 1;
  // The memories, in rank order: each in one of `request`'s namespaces.
  repeated bytes ids = 2;
}

message RecallBodiesResponse {
  // `RecallBodies`' versioned bytes.
  bytes bodies = 1;
}

// One partition's part of a `Memory.Watch` (#1915, ICR 0139).
message ForwardMemoryWatchRequest {
  // The sending node's map version, as for `Forward`.
  uint64 map_version = 1;
  // Who the watch is for, checked again here.
  ForwardedCaller caller = 2;
  // The partition whose part this is: every namespace in `request` must be placed on it.
  string partition = 3;
  // A single node's watch: its namespaces narrowed to this partition's, and `resume` this
  // partition's own token.
  MemoryWatchRequest request = 4;
}

// One partition's part of a fanned-out scan (D317 ticket 4).
message ForwardScanRequest {
  // The sending node's map version, as in `ForwardRequest`.
  uint64 map_version = 1;
  ForwardedCaller caller = 2;
  // The partition to scan: it must be this node's.
  string partition = 3;
  // The scan, with `after` (if any) this partition's own position and `limit` what's left.
  ScanRequest scan = 4;
  // As `ForwardRequest`'s (D328): the entry node chose this node's replica copy of the
  // partition. Each page is read from the copy only while it's fresh within
  // `replica_max_lag_ms`, else the stream ends with `ReplicaBehind` and the entry node
  // continues from the last page's position on the next replica or the owner.
  bool to_replica = 7;
  uint64 replica_max_lag_ms = 5;
  uint64 min_primary_seqno = 6;
}

// One message of a forwarded `Vectors.BulkLoad` part (#1722 PR 3). The first carries
// `map_version`, `caller` and `partition`, and its `load` the index and `expected` (the
// client's, for the whole load); the later ones carry only `load.items`.
message ForwardBulkLoadRequest {
  // The sending node's map version, as in `ForwardRequest`.
  uint64 map_version = 1;
  ForwardedCaller caller = 2;
  // The partition to load: it must be this node's.
  string partition = 3;
  VectorBulkLoadRequest load = 4;
}

// The caller a forwarded call is for: never `admin` or `cluster`, since only data calls are
// forwarded.
message ForwardedCaller {
  // `read` or `write`.
  string scope = 1;
  // The namespaces the caller's token is limited to. Empty with `all_namespaces`.
  repeated string namespaces = 2;
  bool all_namespaces = 3;
  // The SHA-256 digest of the caller's token (D317 ticket 3), which its sessions are bound
  // to; empty on a cluster without tokens. The node it's sent to must list the same token.
  bytes token_digest = 4;
}

// A forwarded call's answer: the reply its op has on a single node. Errors travel as the
// call's own status.
// Opens a spanning transaction's branch on `ForwardRequest.partition` (D329), keyed by the
// transaction's id (its xid), at that partition's snapshot now; with `renew`, renews the open
// one instead, or answers `TransactionExpired` if it's gone (never reopening it).
message BranchBegin {
  string xid = 1;
  bool renew = 2;
}

// Prepares a branch (D329): a writing transaction's durably (its reads and writes held until
// `BranchDecide`), or with `read_only` a hold of its reads in memory, released by a
// `BranchDecide` that names the hold.
message BranchPrepare {
  string xid = 1;
  bool read_only = 2;
}

// Decides a prepared branch (D329): commit or abort, synced before the answer. With `hold`
// (non-zero), the release of a read-only branch's hold instead, which answers only if the
// hold lasted and the partition's lease term is still `term`; otherwise `Conflict`.
message BranchDecide {
  string xid = 1;
  bool commit = 2;
  uint64 hold = 3;
  uint64 term = 4;
}

// `phdb cluster txn decide` (D329): an operator decides a share held in doubt on this node's
// `partition`, for a home that will never answer. Without `force`, refused while the home
// answers `ResolveTxn`.
message DecideTxnRequest {
  string partition = 1;
  string xid = 2;
  bool commit = 3;
  bool force = 4;
}

// What a share in doubt asks its home (D329): the transaction's xid. With `acked` (the
// branch's partition), the branch reports it has applied the commit its home answered, for
// the decision record's GC; the answer is then the decision again.
message ResolveTxn {
  string xid = 1;
  string acked = 2;
}

// The home's answer (D329): `COMMITTED` or `ABORTED` decides the share; `IN_PROGRESS` and
// `UNKNOWN` leave it in doubt (`reason` says why).
message TxnResolution {
  TxnOutcomeState state = 1;
  string reason = 2;
}

// A prepared branch (D329): for a read-only one, its hold and the lease term it was taken in.
message BranchPrepared {
  uint64 hold = 1;
  uint64 term = 2;
}

message ForwardResponse {
  oneof reply {
    GetResponse get = 1;
    ReadRowResponse read_row = 2;
    // `mutate` and `batch`.
    MutateResponse mutate = 3;
    CheckAndMutateResponse check_and_mutate = 4;
    MutateReturningResponse mutate_returning = 5;
    MultiGetResponse multi_get = 6;
    // D317 ticket 3 (6 is ticket 4's `multi_get`). A transaction's reads answer `get` and
    // `read_row`; its writes, `Abort` and `Release` answer `empty`.
    BeginResponse begin = 7;
    TxnCommitResponse commit = 8;
    OpenSnapshotResponse open_snapshot = 9;
    Empty empty = 10;
    NearestResponse nearest = 11;
    // `create_table`'s; `drop_table` answers `empty`. 11 is ticket 4b's `nearest`.
    TableResponse table = 12;
    // One partition's part of an index search or check (#1722 PR 1b).
    VectorSearchResponse vector_search = 13;
    VectorVerifyResponse vector_verify = 14;
    // A rebuild's part (#1722 PR 2c).
    TextRebuildResponse text_rebuild = 15;
    TextVerifyResponse text_verify = 16;
    // A text search's two rounds (#1722 PR 2b).
    TextStatsResponse text_stats = 17;
    TextSearchResponse text_search = 18;
    // The memory calls' (#1915, ICR 0139; 13–18 are ICR 0138's). `supersede` and `link`
    // answer `empty`.
    RememberResponse remember = 19;
    RecallResponse recall = 20;
    MarkUsedResponse mark_used = 21;
    ForgetResponse forget = 22;
    RecallPoolResponse recall_pool = 23;
    RecallBodiesResponse recall_bodies = 24;
    BranchPrepared branch_prepare = 25;
    TxnResolution resolve_txn = 26;
    TxnOutcomeResponse txn_outcome = 30;
    // D331 PR 4b: `range_copy`'s chunk.
    RangeCopyResponse range_copy = 27;
  }
  // The seqno the serving node read at, in the owner's numbering (D328's
  // `x-pigeonhole-served-seqno`): a replica copy's applied seqno after the read, or the
  // owner's visible seqno after it. Set for a single-partition read; 0 otherwise.
  uint64 served_seqno = 28;
}

message ForwardSubscribeRequest {
  // The sending node's map version, as for `Forward`.
  uint64 map_version = 1;
  // Who the subscription is for, checked again here.
  ForwardedCaller caller = 2;
  // The partition whose part this is: every table in `request` must be placed on it.
  string partition = 3;
  // A single node's subscription: tables, prefix, visibility and start (`resume` is this
  // partition's own token). Its cluster-only fields are unset.
  SubscribeRequest request = 4;
  // Pass over commits up to this seqno after the token (the cluster's `skip_through`), at
  // most 64 of them; 0: none.
  uint64 skip_through = 5;
  // D331: start the component at this partition's hand-over position for the request's
  // tables (the earliest of its serving rows' tokens), not `request`'s start: a cluster
  // resume whose token lacks this partition because a range move gave it the tables since.
  // `FeedExpired` if no move did, or its feed has trimmed past that position.
  bool from_hand_over = 6;
  // D331 PR 4b, a range move's catch-up (internal): the rows `[range_start, range_end)` of
  // the request's one table, an absent bound open. With `raw`, the commits' changes in the
  // range come as `FeedEvent.raw_commits`, the commits ready at once batched, stored values
  // and kinds as logged; accepted
  // only for the bounds of a live move from this partition (COPYING through HANDED_OVER).
  SplitKey range_start = 7;
  SplitKey range_end = 8;
  bool raw = 9;
}

// D331 PR 4b: one chunk of a range move's copy (`ForwardRequest.range_copy`). The source
// serves it only as the partition's owner at the map's epoch, for a live move naming it as
// `from` in COPYING.
message RangeCopyRequest {
  string move_id = 1;
  string table = 2;
  // The row to start at; empty: the move's start.
  bytes after = 3;
  // The most bytes to read for the chunk (it ends at a row boundary past them).
  uint64 max_bytes = 4;
}

// D331 PR 4b: a range copy's chunk, as a compaction would write it at its snapshot.
message RangeCopyResponse {
  repeated RangeCopyCell cells = 1;
  // The row to ask for next; absent: the range is done.
  optional bytes next = 2;
  // The chunk's snapshot.
  uint64 snapshot_seqno = 3;
  // The source's feed token at the first chunk's snapshot (the catch-up starts there);
  // empty on later chunks.
  bytes token = 4;
}

// One cell of a range copy, as its source logged it.
message RangeCopyCell {
  string family = 1;
  // The logged kind (FORMAT §2: put 1, merge 2, cell delete 3, column delete 4, family
  // delete 5).
  uint32 kind = 2;
  bytes row = 3;
  bytes qualifier = 4;
  uint64 timestamp = 5;
  // The stored value, tag byte first; empty for a delete.
  bytes stored = 6;
}

// D326: a node's lease round asks each node of its map, itself included, for a grant.
message LeaseRequest {
  // Refused (`InvalidArgument`) if it isn't this node's cluster.
  string cluster_id = 1;
  // The asking node.
  string node_id = 2;
  // The asking node's map version: this node grants only at the same version.
  uint64 map_version = 3;
  // The asking node's round, rising: a request older than the last one this node took
  // from it is ignored.
  uint64 round = 4;
  // What it asks for: each partition it serves that its map names it for, at the file's
  // epoch. A grant replaces the asking node's previous one, so what it no longer asks for
  // is no longer granted.
  repeated LeasePart parts = 5;
  // The asking node's `--cluster-lease-ms`. Refused (`FailedPrecondition`, naming both) if
  // it isn't this node's: a holder with a longer lease than its grantors' would serve past
  // their grants (audit120's M1).
  uint64 lease_ms = 6;
  // A random id the asking node picks when it starts. A request with another id than the
  // one this node's grant to it carries is a new start of that node: its rounds start
  // again, so the round order doesn't apply, and the request replaces the grant (a node
  // that starts holds no lease).
  uint64 start = 7;
  // D330: the asking node's map's writer term. This node grants only at the same
  // `(writer_term, map_version)`, and answers `newer_map_version` when its own sorts after
  // the request's (simp724's S1 on the PR 1 plan). 0 from older nodes, as for a map at term 0.
  uint64 writer_term = 8;
  // D330 PR 2: an election's pre-vote. The request asks for the writer lease alone, as a
  // vote does; the answer grants it only if this node would vote, and records nothing.
  // A candidate asks for real votes only once a majority would, so a node that can't win
  // never records a vote, whose term would fence the live writer's maps from it once it
  // rejoins.
  bool pre_vote = 9;
}

// A partition at an epoch.
message LeasePart {
  string partition = 1;
  uint64 epoch = 2;
  // D330: for the writer lease (`partition` "__writer"), the writer term asked for or
  // granted; `epoch` is then 0. 0 for a partition.
  uint64 term = 3;
  // D330, from an owner: the external transaction shares it holds in doubt for this
  // partition (at most 4 KiB of ids), and how many there are, so a writer that fails the
  // partition over can name them. Empty in a grantor's answer.
  repeated string in_doubt_xids = 4;
  uint64 in_doubt_count = 5;
}

message LeaseResponse {
  // This node's map is newer than the request's: nothing is granted, and the asking node
  // takes the newer map. 0 otherwise.
  uint64 newer_map_version = 1;
  // Granted until `--cluster-lease-ms` after this node received the request, on its clock:
  // the parts asked that this node's map, at the request's version, gives the asking node.
  repeated LeasePart granted = 2;
  // Withheld: another node's grant of the partition is still live here.
  repeated LeaseWithheld withheld = 3;
  // This node is in its start grace and grants nothing until it ends: the time left. 0
  // otherwise.
  uint64 grace_remaining_ms = 4;
  // D330: the grantor's highest writer term, its map's or one it voted for, on an answer
  // to an election vote (a `__writer` part above its map's term). A candidate refused for a
  // term at or below it asks again above it. 0 otherwise.
  uint64 writer_term = 5;
}

// A partition this node won't grant yet, and why.
message LeaseWithheld {
  string partition = 1;
  // The node whose grant of it is live here.
  string holder = 2;
  // The time left on that grant, in milliseconds.
  uint64 remaining_ms = 3;
}

// D326: a node gives up partitions it closed.
message ReleaseRequest {
  // Refused (`InvalidArgument`) if it isn't this node's cluster.
  string cluster_id = 1;
  // The releasing node.
  string node_id = 2;
  // The releasing node's round, numbered with its lease rounds: a lease request older
  // than it is then ignored.
  uint64 round = 3;
  // The partitions given up, at their epochs.
  repeated LeasePart parts = 4;
  // The releasing node's start id, as `LeaseRequest.start`: a release of another start
  // than the grant's is ignored.
  uint64 start = 5;
}

message ReleaseResponse {}
