// Pigeonhole's network API, v1: static partitions across `phdb serve` nodes (D317, ICR 0117).
// The partition map, and the `Cluster` service that sets, distributes and reports it.
syntax = "proto3";

package pigeonhole.v1;

import "pigeonhole/v1/common.proto";
import "pigeonhole/v1/data.proto";
import "pigeonhole/v1/feed.proto";
import "pigeonhole/v1/schema.proto";
import "pigeonhole/v1/transactions.proto";
import "pigeonhole/v1/vector.proto";

service Cluster {
  // The node's newest map. Read, admin or cluster scope.
  rpc GetMap(GetMapRequest) returns (ClusterMap);
  // Replaces the map: validated, persisted on this node, then pushed to every node in it.
  // Answers once it's persisted here, with what each push did (in parallel, each bounded by
  // `--cluster-push-timeout-ms`). `Conflict` (`ABORTED`, not applied) when
  // `expected_map_version` isn't this node's version: re-read the map and try again; the
  // message carries the current version. `InvalidArgument` for a map that fails validation
  // or makes a change the map may not make. Admin scope.
  rpc SetMap(SetMapRequest) returns (SetMapResponse);
  // Node to node: a newer map, accepted only from the same cluster with a greater
  // `map_version` and a valid change; the same version with the same bytes is a no-op.
  // `InvalidArgument` otherwise: older, another cluster's, an invalid change, or divergent
  // (the same version, different bytes, which `Status` then reports on both nodes).
  // Cluster scope, gRPC only.
  rpc PushMap(PushMapRequest) returns (PushMapResponse);
  // This node: its id, its map version and the partitions in its directory. Read, admin or
  // cluster scope.
  rpc Status(StatusRequest) returns (NodeStatus);
  // Node to node (D317 ticket 2): a single-key call the sending node routed to this one, for
  // the caller it names, whose scope and namespaces this node checks again. This node
  // serves it only if its own map gives it the key; otherwise `WrongPartition` with its
  // `map_version`, and it never forwards it on (the sending node pulls the map and forwards
  // once more). Every other answer is the call's own, as a single node gives it. Cluster
  // scope, gRPC only.
  rpc Forward(ForwardRequest) returns (ForwardResponse);
  // Node to node (D317 ticket 4): one partition's part of a scan the sending node fans out,
  // for the caller it names, as this node's own `Data.Scan` stream of it. This node serves
  // it only if its map gives it `partition` and it has the partition open; otherwise
  // `WrongPartition` with its `map_version`. Cluster scope, gRPC only.
  rpc ForwardScan(ForwardScanRequest) returns (stream ScanPage);
  // Node to node (D317 ticket 7): one partition's part of a cluster subscription, which the
  // sending node merges with the others. Served only if this node's map gives it the
  // partition, and only on connections of their own (never the `Forward` pool), so a
  // subscriber that stops reading can't stall forwarded calls. The events are a single
  // node's: a token on every one, no `partition`. Cluster scope, gRPC only.
  rpc ForwardSubscribe(ForwardSubscribeRequest) returns (stream FeedEvent);
  // D317 ticket 6: marks a partition open here fenced, a local flag persisted beside the map
  // (`fenced.json`). Its writes then answer `Fenced` (not committed: retry once it's
  // unfenced, or at its new node); its reads go on. Answers once every write admitted before
  // the flag has answered. `FailedPrecondition` for a partition this node doesn't hold.
  // Admin scope.
  rpc Fence(PartitionRequest) returns (LocalPartition);
  // Clears the fence, after reopening the partition if it's closed. `FailedPrecondition`
  // unless this node's map names it as the partition's node at the epoch in its file.
  // Admin scope.
  rpc Unfence(PartitionRequest) returns (LocalPartition);
  // D317 amendment 2: closes a fenced partition, so its files are final. Its feed streams
  // and scans end with `PartitionUnavailable`, and so do its calls from then on. Answers
  // `CLOSED` at once; `files` fills in once they're hashed (`Status`). `FailedPrecondition`
  // unless it's fenced. Admin scope.
  rpc Close(PartitionRequest) returns (LocalPartition);
  // Moves a partition's files left on this node, after it moved away, into
  // `<cluster dir>/.phdb-dropped/` (nothing is deleted). `FailedPrecondition` while this
  // node's map names it as the partition's node, or while it's open. Admin scope.
  rpc DropPartition(PartitionRequest) returns (LocalPartition);
  // `phdb cluster relocate`'s first step, on the partition's new node: installs a complete
  // staged file set (`Admin.PartitionUpload`), if one is staged, then rewrites the file's
  // identity from `from_epoch` to `to_epoch`. A file already at `to_epoch` is a no-op, so a
  // rerun resumes. The reply's `files` is the set this call installed (none: empty).
  // `FailedPrecondition` while the partition is open here, or for a file of another
  // cluster, partition or epoch. Admin scope.
  rpc Stamp(StampRequest) returns (LocalPartition);
}

// One partition on the node a `Cluster` call is sent to (D317 ticket 6).
message PartitionRequest {
  string partition = 1;
  // `Unfence` only: lift a start fence even though no peer's map (at least as new as this
  // node's, naming it for the partition at its file's epoch) confirms it. For a node whose
  // peers can't answer; it risks two writers if a peer's newer map moved the partition.
  bool force = 2;
}

// `Cluster.Stamp` (D317 ticket 6).
message StampRequest {
  // This cluster's id, which the file must record (or, with `restore_from_cluster_id`, which
  // it's rewritten to).
  string cluster_id = 1;
  string partition = 2;
  // The map's epoch for the partition, and that epoch + 1.
  uint64 from_epoch = 3;
  uint64 to_epoch = 4;
  // A restore (D317 ticket 8b): the file may be at any epoch up to `from_epoch`, since a
  // backup records the epoch it was taken at. Without it a file below `from_epoch` is
  // refused.
  bool restore = 5;
  // With `restore`: the cluster the file records, restored into this one as a new cluster.
  string restore_from_cluster_id = 6;
}

// A partition's state on its node (D317 ticket 6).
enum LocalPartitionState {
  LOCAL_PARTITION_STATE_UNSPECIFIED = 0;
  // Open, reads and writes served.
  LOCAL_PARTITION_STATE_SERVING = 1;
  // Open, reads served, writes answer `Fenced`. Its files still change (flushes and
  // compactions).
  LOCAL_PARTITION_STATE_FENCED = 2;
  // Fenced and closed: its files are final, and its calls answer `PartitionUnavailable`.
  LOCAL_PARTITION_STATE_CLOSED = 3;
  // Being opened: its calls answer `PartitionUnavailable` until it's open.
  LOCAL_PARTITION_STATE_OPENING = 4;
}

// Why a partition is fenced (D317 ticket 6).
enum FenceReason {
  FENCE_REASON_UNSPECIFIED = 0;
  // `phdb cluster fence`: kept in the node's `fenced.json` across a restart, lifted only by
  // `phdb cluster unfence`.
  FENCE_REASON_OPERATOR = 1;
  // Fenced since the node started, until a peer's map at least as new as the node's names
  // it for the partition at the file's epoch (or `phdb cluster unfence`).
  FENCE_REASON_AWAITING_PEER_MAP = 2;
}

// The partition map (D317 §1): one versioned document, the same in gRPC, HTTP/JSON and the
// map file (`<cluster dir>/cluster-map.json`, canonical proto3 JSON).
message ClusterMap {
  // Fixed for a cluster's life: a node refuses a map of another cluster, and each partition
  // file records it (`__phdb_cluster`).
  string cluster_id = 1;
  // Raised by every change; a node refuses a map no newer than its own.
  uint64 map_version = 2;
  repeated Node nodes = 3;
  // Which node serves each partition (layer 2: changes by relocation, with a higher epoch).
  repeated Partition partitions = 4;
  // Which partition holds each key range (layer 1: fixed once written).
  repeated TablePlacement tables = 5;
}

message Node {
  string id = 1;
  // The node's listener, `host:port` (TLS unless the cluster runs without it).
  string address = 2;
}

message Partition {
  string id = 1;
  // The node serving it: a `Node.id`.
  string node = 2;
  // Raised by every relocation; a node writes P only while the map's epoch for P equals
  // the epoch in P's file (D317 §2).
  uint64 epoch = 3;
  // The engine memory P takes on its node (D317 ticket 8a): its memtables, block cache and
  // row cache, taken off the top of the node's `--engine-memory` before the rest is split
  // equally across the node's other partitions. 0: an equal share.
  uint64 memory_bytes = 4;
}

message TablePlacement {
  string name = 1;
  // A co-location group (optional): its tables are unsplit and on one partition.
  string group = 2;
  // The table's schema (D317 §5; reconciled onto the partitions from ticket 5).
  repeated FamilySpec families = 3;
  // Sorted, distinct split keys; none: the whole table is one range.
  repeated SplitKey splits = 4;
  // `splits.len() + 1` partition ids: range i is `[splits[i-1], splits[i])`, the first
  // starting at the empty key and the last open-ended.
  repeated string partitions = 5;
  // The map version that created the table through `Schema.CreateTable` (D317 ticket 5), or
  // 0 for a placement set by hand. Fixed for the table's life: a table dropped and created
  // again under its name gets a new one, which tells a node that missed both to drop the
  // old table and create the new.
  uint64 created = 6;
}

// A split key, in the map only: `text` for a UTF-8 key an operator writes by hand, `raw`
// for any bytes. Both forms of one key are the same key.
message SplitKey {
  oneof key {
    string text = 1;
    bytes raw = 2;
  }
}

message GetMapRequest {}

message SetMapRequest {
  // The map version the caller replaces: 0 for a node's first map.
  uint64 expected_map_version = 1;
  ClusterMap map = 2;
  // The forced recovery for a map writer that's down (D317 amendment 1): set the map at
  // this node, which needn't be the writer, without the compare-and-set. The map must be
  // the cluster's, at a version above this node's. `phdb cluster set-map --force` sets it at
  // a version above every reachable node's, naming a live writer.
  bool force = 3;
}

message SetMapResponse {
  uint64 map_version = 1;
  repeated NodePush pushed = 2;
}

// What pushing the map to one node did.
message NodePush {
  string node = 1;
  bool ok = 2;
  // Why not, when `ok` is false: the node pulls the map once it's reachable again.
  string error = 3;
}

message PushMapRequest {
  ClusterMap map = 1;
}

message PushMapResponse {
  // The receiver's map version after the push.
  uint64 map_version = 1;
}

message StatusRequest {}

message NodeStatus {
  string node_id = 1;
  // 0 before the node has a map.
  uint64 map_version = 2;
  string cluster_id = 3;
  repeated LocalPartition partitions = 4;
  // Peers seen with this node's `map_version` but a different map: the cluster has two maps
  // of one version, and an operator must set a newer one.
  repeated string divergent = 5;
}

// A partition file in the node's directory, as its identity row says.
message LocalPartition {
  string id = 1;
  uint64 epoch = 2;
  // Relative to the node's cluster directory.
  string file = 3;
  // False when the file couldn't be read, or its row doesn't match the map: `error` says why.
  bool ok = 4;
  string error = 5;
  // The partition's schema reconcile (D317 ticket 5), on the node serving it: the map version
  // it last reconciled to, what failed, the tables in the file the map doesn't place (made
  // by hand: left alone), and the tables a create through the map took over from a hand-made
  // one of the same name.
  uint64 reconciled_version = 6;
  repeated string reconcile_errors = 7;
  repeated string unmapped_tables = 8;
  repeated string adopted_tables = 9;
  // D317 ticket 6: its state here, for a partition this node holds.
  LocalPartitionState state = 10;
  // A closed partition's files once hashed: each one's name (its suffix after the
  // partition's path), size and SHA-256. Empty while they're being hashed; a failed hash
  // sets `error`, and `Close` again retries it. `Stamp`'s reply: the set it installed.
  repeated PartitionFile files = 11;
  // Why it's fenced: set only when `state` is FENCED.
  FenceReason fence_reason = 12;
}

// A forwarded single-key call (D317 ticket 2).
message ForwardRequest {
  // The sending node's map version. Only older isn't a reason to refuse (D132).
  uint64 map_version = 1;
  // Who the call is for, checked again here.
  ForwardedCaller caller = 2;
  // One partition's part of a read another node fans out (D317 #1715): a multi-get's keys
  // (a 4a multi-get's, or a traversal hop's) or a nearest search's. The sending node holds
  // the in-flight budget for its page, so this node serves it with no budget of its own: no
  // admission and no reply charge, its scope still checked. Only a peer sends it:
  // `Cluster.Forward` takes cluster scope. Set on another call, it's ignored.
  bool fanout_part = 21;
  oneof op {
    GetRequest get = 3;
    ReadRowRequest read_row = 4;
    MutateRequest mutate = 5;
    CheckAndMutateRequest check_and_mutate = 6;
    MutateRequest mutate_returning = 7;
    // Every row in one partition: a batch across partitions is refused before it's sent.
    BatchRequest batch = 8;
    // One partition's keys of a multi-get the sending node fans out (D317 ticket 4).
    MultiGetRequest multi_get = 9;
    // A transaction's or a snapshot's calls (D317 ticket 3), on the node serving the
    // partition it's bound to. Its id names that partition (`<partition>:<id>`). 9 is
    // ticket 4's `multi_get`.
    BeginRequest begin = 10;
    TxnGetRequest txn_get = 11;
    TxnGetRowRequest txn_get_row = 12;
    TxnWriteRequest txn_write = 13;
    TxnCommitRequest commit = 14;
    TxnAbortRequest abort = 15;
    OpenSnapshotRequest open_snapshot = 16;
    ReleaseSnapshotRequest release_snapshot = 17;
    // One partition's part of a `Nearest` the sending node fans out (D317 ticket 4b): its
    // keys, or the range clipped to the partition. After D317 ticket 3's arms.
    NearestRequest nearest = 18;
    // A schema change, sent to the map's writer: the node with the smallest id in the map,
    // which alone changes the map for schema calls, so two entry nodes' changes can't
    // diverge (D317 ticket 5). Another node answers `WrongPartition`.
    CreateTableRequest create_table = 19;
    DropTableRequest drop_table = 20;
  }
}

// One partition's part of a fanned-out scan (D317 ticket 4).
message ForwardScanRequest {
  // The sending node's map version, as in `ForwardRequest`.
  uint64 map_version = 1;
  ForwardedCaller caller = 2;
  // The partition to scan: it must be this node's.
  string partition = 3;
  // The scan, with `after` (if any) this partition's own position and `limit` what's left.
  ScanRequest scan = 4;
}

// The caller a forwarded call is for: never `admin` or `cluster`, since only data calls are
// forwarded.
message ForwardedCaller {
  // `read` or `write`.
  string scope = 1;
  // The namespaces the caller's token is limited to. Empty with `all_namespaces`.
  repeated string namespaces = 2;
  bool all_namespaces = 3;
  // The SHA-256 digest of the caller's token (D317 ticket 3), which its sessions are bound
  // to; empty on a cluster without tokens. The node it's sent to must list the same token.
  bytes token_digest = 4;
}

// A forwarded call's answer: the reply its op has on a single node. Errors travel as the
// call's own status.
message ForwardResponse {
  oneof reply {
    GetResponse get = 1;
    ReadRowResponse read_row = 2;
    // `mutate` and `batch`.
    MutateResponse mutate = 3;
    CheckAndMutateResponse check_and_mutate = 4;
    MutateReturningResponse mutate_returning = 5;
    MultiGetResponse multi_get = 6;
    // D317 ticket 3 (6 is ticket 4's `multi_get`). A transaction's reads answer `get` and
    // `read_row`; its writes, `Abort` and `Release` answer `empty`.
    BeginResponse begin = 7;
    TxnCommitResponse commit = 8;
    OpenSnapshotResponse open_snapshot = 9;
    Empty empty = 10;
    NearestResponse nearest = 11;
    // `create_table`'s; `drop_table` answers `empty`. 11 is ticket 4b's `nearest`.
    TableResponse table = 12;
  }
}

message ForwardSubscribeRequest {
  // The sending node's map version, as for `Forward`.
  uint64 map_version = 1;
  // Who the subscription is for, checked again here.
  ForwardedCaller caller = 2;
  // The partition whose part this is: every table in `request` must be placed on it.
  string partition = 3;
  // A single node's subscription: tables, prefix, visibility and start (`resume` is this
  // partition's own token). Its cluster-only fields are unset.
  SubscribeRequest request = 4;
  // Pass over commits up to this seqno after the token (the cluster's `skip_through`), at
  // most 64 of them; 0: none.
  uint64 skip_through = 5;
}
