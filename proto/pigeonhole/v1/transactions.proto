// Pigeonhole's network API, v1 (D313, ICR 0112): optimistic transactions and pinned
// snapshots, held on the server as leased sessions (D313 §3).
syntax = "proto3";

package pigeonhole.v1;

import "pigeonhole/v1/common.proto";
import "pigeonhole/v1/data.proto";

// A transaction reads at one snapshot, buffers writes, and commits them atomically; a
// conflicting commit fails with `Conflict` and writes nothing. The retry loop is the
// client's. A session allows one call at a time (`SessionBusy` otherwise), expires when
// idle (`TransactionExpired`, only before any `Commit`), and after `Commit` answers every
// call with the commit's recorded outcome until it expires (D313 B1, B2).
service Transactions {
  rpc Begin(BeginRequest) returns (BeginResponse);
  rpc Get(TxnGetRequest) returns (GetResponse);
  rpc GetRow(TxnGetRowRequest) returns (ReadRowResponse);
  // Buffers writes; nothing is visible until `Commit`.
  rpc Write(TxnWriteRequest) returns (Empty);
  // Commits the buffered writes and `writes`. A repeated `Commit` answers the first one's
  // outcome.
  rpc Commit(TxnCommitRequest) returns (TxnCommitResponse);
  // Ends the transaction without writing.
  rpc Abort(TxnAbortRequest) returns (Empty);
  // A transaction's outcome, by its id, after the `Commit` reply was lost (D329): for a
  // transaction begun with `spans_partitions`, from its home partition's decision record,
  // kept for `--txn-outcome-retention`. While its session lives it answers `IN_PROGRESS`
  // and changes nothing. Once the session is gone, a transaction never committed is made
  // final as `ABORTED`, which is why it needs write scope; so is a read-only one that
  // committed, once its session's record is gone (TxnOutcomeResponse says why). `NotFound`
  // past retention, and for other transactions once their session's record is gone. While
  // its session's record lasts, a transaction's outcome answers only the token that owns it
  // (another's is `NotFound`, #2077); after that, the decided outcome answers by id alone.
  rpc Outcome(TxnOutcomeRequest) returns (TxnOutcomeResponse);
}

message BeginRequest {
  // The commit's durability (unset: the writer default).
  Durability durability = 1;
  // Where the transaction runs once the database is partitioned (D317): send it from the
  // start. A single-node server ignores it.
  RoutingKey route = 2;
  // Lets the transaction read and write rows of other partitions (D329, ICR 0140): its
  // partition (`route`) is its home, and every other partition it touches is a branch,
  // committed with it atomically by two-phase commit. Without it, a row outside the home is
  // `CrossPartition`. Every node must keep the `spanning_txns` map feature. A commit that
  // writes runs at `GroupSync` or stronger. A single-node server accepts it and changes
  // nothing.
  bool spans_partitions = 3;
}

message BeginResponse {
  // Opaque: store it and send it back; don't parse it.
  string txn_id = 1;
  // The snapshot's seqno, which the transaction reads at.
  uint64 snapshot_seqno = 2;
}

message TxnGetRequest {
  string txn_id = 1;
  string table = 2;
  bytes row = 3;
  string family = 4;
  bytes qualifier = 5;
}

message TxnGetRowRequest {
  string txn_id = 1;
  string table = 2;
  bytes row = 3;
  // The families to read; each counts as read in full for the conflict check.
  repeated string families = 4;
}

message TxnWriteRequest {
  string txn_id = 1;
  repeated RowWrites rows = 2;
}

message TxnCommitRequest {
  string txn_id = 1;
  // More writes, committed with the buffered ones.
  repeated RowWrites rows = 2;
}

message TxnCommitResponse {
  // A spanning transaction's (`BeginRequest.spans_partitions`): its home partition's commit.
  CommitInfo commit = 1;
  // A spanning transaction that wrote: each partition it touched, the home first. A part not
  // yet `applied` is committed and is applied by its partition's resolver.
  repeated TxnPart parts = 2;
}

message TxnOutcomeRequest {
  string txn_id = 1;
}

// What became of a transaction (D329).
enum TxnOutcomeState {
  TXN_OUTCOME_STATE_UNSPECIFIED = 0;
  // Its session is open or committing: ask again.
  TXN_OUTCOME_STATE_IN_PROGRESS = 1;
  TXN_OUTCOME_STATE_COMMITTED = 2;
  // Aborted, or never committed (now final).
  TXN_OUTCOME_STATE_ABORTED = 3;
  // Its home partition's history changed since it began (a promotion, a restore): the
  // decision may be lost, so nothing is presumed (`reason` says why).
  TXN_OUTCOME_STATE_UNKNOWN = 4;
}

// A commit that wrote is answered from its decision row, kept for --txn-outcome-retention
// from the decision (and, for a commit, until every branch acknowledged it). A read-only
// spanning commit has no decision row: it's answered COMMITTED only while its session's
// record lasts (one --txn-idle-ms after its Commit, not across a restart of its home's
// node), then ABORTED (the first ask records it, for a retention), then NotFound. It wrote
// nothing either way, so Commit's own answer is the one to rely on for whether its reads
// held. From a full retention after a transaction began, a missing row is NotFound, never
// a presumed abort.
message TxnOutcomeResponse {
  TxnOutcomeState state = 1;
  // When committed: the home's commit, and each partition's share as recorded.
  CommitInfo commit = 2;
  repeated TxnPart parts = 3;
  string reason = 4;
}

// One partition's share of a spanning transaction's commit (D329).
message TxnPart {
  string partition = 1;
  // The share's commit seqno on that partition, once applied (0 before).
  uint64 seqno = 2;
  bool applied = 3;
}

message TxnAbortRequest {
  string txn_id = 1;
}

// A snapshot pinned on the server, for reads that must agree across requests (paging a
// scan at one point in time). It holds back purges while it lives, so it's leased: each
// read at it renews the lease, and an idle one expires (D313 §3).
service Snapshots {
  rpc Open(OpenSnapshotRequest) returns (OpenSnapshotResponse);
  // Releases it now. Reads already running finish; later ones get `NOT_FOUND`.
  rpc Release(ReleaseSnapshotRequest) returns (Empty);
}

message OpenSnapshotRequest {
  // Only data durable at the writer's level (`durable_snapshot`), instead of everything
  // visible.
  bool durable = 1;
  // As for `BeginRequest.route`.
  RoutingKey route = 2;
}

message OpenSnapshotResponse {
  // Opaque; pass it as `Selection.snapshot_id` or `GetRequest.snapshot_id`.
  string snapshot_id = 1;
  uint64 seqno = 2;
}

message ReleaseSnapshotRequest {
  string snapshot_id = 1;
}
